services:
  atlas:
    image: ghcr.io/nginx/nginx-unprivileged:1.30.4-alpine3.24-slim@sha256:e88d990b349df8cf4aa82f16642d7a23375016638c9ace4e5c6ca25028e62e65
    container_name: otheryn-otbm-atlas
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${ATLAS_HTTP_PORT:-18088}:8080"
    volumes:
      - "${ATLAS_DATA_DIR:-/volume1/docker/oteryn/atlas/current}:/usr/share/nginx/html:ro"
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/__health | grep -qx ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
