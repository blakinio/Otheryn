---
name: TEMP Atlas local receiver health fix

on:
  push:
    branches:
      - fix/atlas-synology-local-receiver-health
    paths:
      - ".github/workflows/_tmp-atlas-local-receiver-health-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Replace NAS public hairpin health checks with receiver-local checks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = (
              "          for _ in $(seq 1 30); do\n"
              "            if curl --fail --silent --show-error -H \"Authorization: Bearer $token\" \"$url/health\" | grep -q 'READY'; then\n"
              "              break\n"
              "            fi\n"
              "            sleep 2\n"
              "          done\n"
              "          curl --fail --silent --show-error -H \"Authorization: Bearer $token\" \"$url/health\" | grep -q 'READY'\n"
          )
          new = (
              "          for _ in $(seq 1 30); do\n"
              "            if docker exec -e ATLAS_INGEST_TOKEN=\"$token\" \"$receiver\" python -c \\\\\n"
              "              'import json, os; from urllib.request import Request, urlopen; request=Request(\"http://127.0.0.1:8080/health\", headers={\"Authorization\": \"Bearer \" + os.environ[\"ATLAS_INGEST_TOKEN\"]}); assert json.load(urlopen(request, timeout=5))[\"status\"] == \"READY\"'; then\n"
              "              break\n"
              "            fi\n"
              "            sleep 2\n"
              "          done\n"
              "          docker exec -e ATLAS_INGEST_TOKEN=\"$token\" \"$receiver\" python -c \\\\\n"
              "            'import json, os; from urllib.request import Request, urlopen; request=Request(\"http://127.0.0.1:8080/health\", headers={\"Authorization\": \"Bearer \" + os.environ[\"ATLAS_INGEST_TOKEN\"]}); assert json.load(urlopen(request, timeout=5))[\"status\"] == \"READY\"'\n"
          )

          paths = [
              Path('.github/workflows/otbm-atlas-ci-ingest-tests.yml'),
              Path('.github/workflows/otbm-atlas-full-world-16.yml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              assert text.count(old) == 1, f'expected exactly one public NAS health block in {path}'
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/_tmp-atlas-local-receiver-health-fix.yml').unlink()
          PY
          git diff --check
          git diff -- .github/workflows/otbm-atlas-ci-ingest-tests.yml .github/workflows/otbm-atlas-full-world-16.yml .github/workflows/_tmp-atlas-local-receiver-health-fix.yml
      - name: Commit exact workflow fix and self-delete helper
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/otbm-atlas-ci-ingest-tests.yml .github/workflows/otbm-atlas-full-world-16.yml .github/workflows/_tmp-atlas-local-receiver-health-fix.yml
          git commit -m 'fix(atlas): health-check Synology receiver locally'
          git push origin "HEAD:${GITHUB_REF_NAME}"
