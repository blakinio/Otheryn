name: Temporary Atlas Resume Integrity Fix
on:
  push:
    branches: [blakinio/atlas-environment-animation-resume]
    paths: [.github/workflows/zz-atlas-env-integrity-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: blakinio/atlas-environment-animation-resume
      - name: Verify payload hashes before checkpoint reuse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/otbm_atlas/environment_animation_resume.py')
          text=p.read_text(encoding='utf-8')
          text=text.replace('EXPORT_VERSION = 1','EXPORT_VERSION = 2',1)
          old='''def _atomic_bytes(path: Path, payload: bytes) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    temporary = path.with_suffix(path.suffix + ".tmp")\n    temporary.write_bytes(payload)\n    temporary.replace(path)\n\n\n'''
          new='''def _atomic_bytes(path: Path, payload: bytes) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    temporary = path.with_suffix(path.suffix + ".tmp")\n    temporary.write_bytes(payload)\n    temporary.replace(path)\n\n\ndef _payload_sha256(payload: bytes) -> str:\n    return hashlib.sha256(payload).hexdigest()\n\n\ndef _ensure_bytes(path: Path, payload: bytes) -> str:\n    expected = _payload_sha256(payload)\n    if not path.is_file() or _sha256(path) != expected:\n        _atomic_bytes(path, payload)\n    return expected\n\n\n'''
          if old not in text: raise SystemExit('atomic bytes block missing')
          text=text.replace(old,new,1)
          old='''    path = output / relative\n    if not path.exists():\n        _atomic_bytes(path, encode_png(width, height, pixels))\n    return relative\n'''
          new='''    path = output / relative\n    _ensure_bytes(path, encode_png(width, height, pixels))\n    return relative\n'''
          if old not in text: raise SystemExit('content png block missing')
          text=text.replace(old,new,1)
          old='''    shard = checkpoint.get("shard")\n    if records:\n        if not isinstance(shard, str) or not (output / shard).is_file():\n            return False\n        try:\n            payload = json.loads((output / shard).read_text(encoding="utf-8"))\n        except (OSError, json.JSONDecodeError):\n            return False\n        values = payload.get("records", []) if isinstance(payload, dict) else []\n        if not isinstance(values, list) or len(values) != records:\n            return False\n        expected_assets = sorted({path for record in values if isinstance(record, dict) for path in _record_assets(record)})\n        if expected_assets != checkpoint.get("assets", []):\n            return False\n    elif shard is not None:\n        return False\n    return all((output / relative).is_file() for relative in checkpoint.get("assets", []))\n'''
          new='''    shard = checkpoint.get("shard")\n    if records:\n        if not isinstance(shard, str) or not (output / shard).is_file():\n            return False\n        shard_checksum = checkpoint.get("shardChecksum")\n        if not isinstance(shard_checksum, str) or _sha256(output / shard) != shard_checksum:\n            return False\n        try:\n            payload = json.loads((output / shard).read_text(encoding="utf-8"))\n        except (OSError, json.JSONDecodeError):\n            return False\n        values = payload.get("records", []) if isinstance(payload, dict) else []\n        if not isinstance(values, list) or len(values) != records:\n            return False\n        expected_assets = sorted({path for record in values if isinstance(record, dict) for path in _record_assets(record)})\n        if expected_assets != checkpoint.get("assets", []):\n            return False\n    elif shard is not None or checkpoint.get("shardChecksum") is not None:\n        return False\n    assets = checkpoint.get("assets", [])\n    checksums = checkpoint.get("assetChecksums")\n    if not isinstance(assets, list) or not isinstance(checksums, dict) or set(checksums) != set(assets):\n        return False\n    for relative in assets:\n        path = output / relative\n        expected = checksums.get(relative)\n        if not path.is_file() or not isinstance(expected, str) or _sha256(path) != expected:\n            return False\n    return True\n'''
          if old not in text: raise SystemExit('checkpoint validation block missing')
          text=text.replace(old,new,1)
          old='''            for phase, relative in enumerate(frames):\n                path = output / relative\n                if not path.exists():\n                    _atomic_bytes(path, encode_png(details.width, details.height, phase_pixels[phase]))\n                chunk_assets.add(relative)\n'''
          new='''            for phase, relative in enumerate(frames):\n                path = output / relative\n                _ensure_bytes(path, encode_png(details.width, details.height, phase_pixels[phase]))\n                chunk_assets.add(relative)\n'''
          if old not in text: raise SystemExit('frame block missing')
          text=text.replace(old,new,1)
          old='''        checkpoint = {\n            "schemaVersion": 1,\n            "exportVersion": EXPORT_VERSION,\n            "fingerprint": fingerprint,\n            "instances": len(records),\n            "staticFallbacks": chunk_fallbacks,\n            "animationKeys": sorted(chunk_keys),\n            "assets": sorted(chunk_assets),\n            "shard": shard_relative,\n        }\n'''
          new='''        sorted_assets = sorted(chunk_assets)\n        checkpoint = {\n            "schemaVersion": 1,\n            "exportVersion": EXPORT_VERSION,\n            "fingerprint": fingerprint,\n            "instances": len(records),\n            "staticFallbacks": chunk_fallbacks,\n            "animationKeys": sorted(chunk_keys),\n            "assets": sorted_assets,\n            "assetChecksums": {relative: _sha256(output / relative) for relative in sorted_assets},\n            "shard": shard_relative,\n            "shardChecksum": _sha256(canonical_shard_path) if records else None,\n        }\n'''
          if old not in text: raise SystemExit('checkpoint write block missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8',newline='\n')

          t=Path('tools/otbm_atlas/tests/test_environment_animation_resume.py')
          tests=t.read_text(encoding='utf-8')
          marker='''    def test_changed_chunk_removes_stale_shard_and_orphan_payloads(self) -> None:\n'''
          extra='''    def test_corrupted_payload_invalidates_checkpoint_and_repairs_bytes(self) -> None:\n        output, assets = self.make_fixture()\n        with patch("tools.otbm_atlas.environment_animation_resume.AssetRenderer", _FakeRenderer):\n            first = enrich_environment_animations_resumable(assets, output)\n            shard = json.loads((output / "data/environment-animations/chunks/z7/1_1.json").read_text(encoding="utf-8"))\n            frame = output / shard["records"][0]["frames"][0]\n            expected = frame.read_bytes()\n            frame.write_bytes(b"corrupt")\n            second = enrich_environment_animations_resumable(assets, output)\n        self.assertEqual(first["instances"], 1)\n        self.assertEqual(second["instances"], 1)\n        self.assertEqual(second["reusedChunks"], 0)\n        self.assertEqual(frame.read_bytes(), expected)\n\n    def test_corrupted_shard_invalidates_checkpoint(self) -> None:\n        output, assets = self.make_fixture()\n        with patch("tools.otbm_atlas.environment_animation_resume.AssetRenderer", _FakeRenderer):\n            enrich_environment_animations_resumable(assets, output)\n            shard = output / "data/environment-animations/chunks/z7/1_1.json"\n            shard.write_text('{"schemaVersion":2,"records":[]}\\n', encoding="utf-8")\n            second = enrich_environment_animations_resumable(assets, output)\n        self.assertEqual(second["instances"], 1)\n        self.assertEqual(second["reusedChunks"], 0)\n        repaired = json.loads(shard.read_text(encoding="utf-8"))\n        self.assertEqual(len(repaired["records"]), 1)\n\n'''
          if marker not in tests: raise SystemExit('test marker missing')
          t.write_text(tests.replace(marker,extra+marker,1),encoding='utf-8',newline='\n')
          PY
          rm .github/workflows/zz-atlas-env-integrity-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/otbm_atlas .github/workflows/zz-atlas-env-integrity-fix.yml
          git commit -m 'fix(atlas): verify resumable cache payload integrity'
          git push origin HEAD:blakinio/atlas-environment-animation-resume
