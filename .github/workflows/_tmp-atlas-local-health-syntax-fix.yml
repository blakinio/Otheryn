---
name: TEMP Atlas local health syntax fix

on:
  push:
    branches:
      - fix/atlas-synology-local-receiver-health
    paths:
      - ".github/workflows/_tmp-atlas-local-health-syntax-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Collapse receiver-local health command to one shell line
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          probe = "'import json, os; from urllib.request import Request, urlopen; request=Request(\"http://127.0.0.1:8080/health\", headers={\"Authorization\": \"Bearer \" + os.environ[\"ATLAS_INGEST_TOKEN\"]}); assert json.load(urlopen(request, timeout=5))[\"status\"] == \"READY\"'"
          old_if = '            if docker exec -e ATLAS_INGEST_TOKEN="$token" "$receiver" python -c \\\\\n              ' + probe + '; then\n'
          new_if = '            if docker exec -e ATLAS_INGEST_TOKEN="$token" "$receiver" python -c ' + probe + '; then\n'
          old_final = '          docker exec -e ATLAS_INGEST_TOKEN="$token" "$receiver" python -c \\\\\n            ' + probe + '\n'
          new_final = '          docker exec -e ATLAS_INGEST_TOKEN="$token" "$receiver" python -c ' + probe + '\n'

          for path in [Path('.github/workflows/otbm-atlas-ci-ingest-tests.yml'), Path('.github/workflows/otbm-atlas-full-world-16.yml')]:
              text = path.read_text(encoding='utf-8')
              assert text.count(old_if) == 1, f'if probe mismatch in {path}'
              assert text.count(old_final) == 1, f'final probe mismatch in {path}'
              text = text.replace(old_if, new_if, 1).replace(old_final, new_final, 1)
              path.write_text(text, encoding='utf-8')
          Path('.github/workflows/_tmp-atlas-local-health-syntax-fix.yml').unlink()
          PY
          git diff --check
          git diff -- .github/workflows/otbm-atlas-ci-ingest-tests.yml .github/workflows/otbm-atlas-full-world-16.yml .github/workflows/_tmp-atlas-local-health-syntax-fix.yml
      - name: Commit exact syntax fix and self-delete helper
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/otbm-atlas-ci-ingest-tests.yml .github/workflows/otbm-atlas-full-world-16.yml .github/workflows/_tmp-atlas-local-health-syntax-fix.yml
          git commit -m 'fix(atlas): use one-line local receiver health probe'
          git push origin "HEAD:${GITHUB_REF_NAME}"
