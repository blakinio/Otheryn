name: Native protocol correspondence

on:
  pull_request:
    paths:
      - docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CORRESPONDENCE.md
      - docs/agents/tasks/active/OTH-20260805-native-protocol-single-version-completion.md
      - .github/workflows/native-protocol-correspondence.yml
  push:
    branches: [main]
    paths:
      - docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CORRESPONDENCE.md
      - .github/workflows/native-protocol-correspondence.yml

permissions:
  contents: read

env:
  CORRESPONDENCE: docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CORRESPONDENCE.md
  PLATFORM_MERGE: c0b8703d326a04b43ae8e06f6192b0cb91c859b7
  PLATFORM_HEAD: eaed70477258e0e1dfb5b03c1e74002913e919dc
  SCHEMA_SHA: 9c67f19525400fb9890d2a3541ceb6d02eb955061540ad39ca1c1d891c06eba9

jobs:
  architecture:
    name: Audit 1 - architecture boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          grep -Fq 'family = oteryn' "$CORRESPONDENCE"
          grep -Fq 'native_protocol_version = 1' "$CORRESPONDENCE"
          grep -Fq 'separate native listener' "$CORRESPONDENCE"
          grep -Fq 'no native profile field, alias, placeholder, catalogue, enum, registry, factory, ordering or selector' "$CORRESPONDENCE"
          grep -Fq 'Canary compatibility profiles remain isolated' "$CORRESPONDENCE"
  security:
    name: Audit 2 - security and admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          grep -Fq 'atomically transition `ISSUED_UNBOUND` to `ACTIVE_BOUND' "$CORRESPONDENCE"
          grep -Fq 'replay, wrong binding and ambiguous consume/bind outcomes terminal' "$CORRESPONDENCE"
          grep -Fq 'TLS 1.3' "$CORRESPONDENCE"
          grep -Fq 'never migrates them to Canary' "$CORRESPONDENCE"
  parser:
    name: Audit 3 - parser and state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          grep -Fq 'unsigned 32-bit big-endian framing' "$CORRESPONDENCE"
          grep -Fq 'bounded duplicate-result cache' "$CORRESPONDENCE"
          grep -Fq 'digest covers exact on-wire' "$CORRESPONDENCE"
          grep -Fq 'one bounded replacement-snapshot resync' "$CORRESPONDENCE"
  regression:
    name: Audit 4 - Canary regression boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - run: |
          base=$(git merge-base HEAD origin/main)
          test -z "$(git diff --name-only "$base...HEAD" | grep -E '(^src/|^config.lua|^data/)' || true)"
          grep -Fq 'native does not import, alias or extend it' "$CORRESPONDENCE"
  provenance:
    name: Audit 5 - provenance rollout rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          grep -Fq "$PLATFORM_MERGE" "$CORRESPONDENCE"
          grep -Fq "$PLATFORM_HEAD" "$CORRESPONDENCE"
          grep -Fq "$SCHEMA_SHA" "$CORRESPONDENCE"
          ! grep -Fq 'PENDING_' "$CORRESPONDENCE"
          grep -Fq 'Rollback disables advertisement first' "$CORRESPONDENCE"
          grep -Fq 'production' "$CORRESPONDENCE"
