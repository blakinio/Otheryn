name: OAM-051A Materialize

on:
  push:
    branches:
      - dudantas/oam-051a-wheel-safety-adapt
    paths:
      - tools/ai-agent/oam_051a_materialize.py
      - tools/ai-agent/oam_051a_materialize_bootstrap.py
      - .github/workflows/oam-051a-materialize.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - tools/ai-agent/oam_051a_materialize.py
      - tools/ai-agent/oam_051a_materialize_bootstrap.py
      - .github/workflows/oam-051a-materialize.yml

permissions:
  contents: write

concurrency:
  group: oam-051a-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: dudantas/oam-051a-wheel-safety-adapt
          fetch-depth: 0

      - name: Verify branch and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "dudantas/oam-051a-wheel-safety-adapt"
          test -z "$(git status --porcelain)"

      - name: Materialize bounded adaptation
        id: materialize
        shell: bash
        run: |
          set +e
          python tools/ai-agent/oam_051a_materialize_bootstrap.py > /tmp/oam-051a-materialize.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail on materializer error
        if: steps.materialize.outputs.status != '0'
        shell: bash
        run: |
          cat /tmp/oam-051a-materialize.log
          exit 1

      - name: Verify exact scope
        id: scope
        if: steps.materialize.outputs.status == '0'
        shell: bash
        run: |
          set +e
          expected="$(printf '%s\n' \
            src/creatures/players/components/wheel/player_wheel.cpp \
            src/creatures/players/components/wheel/player_wheel.hpp \
            src/creatures/players/components/wheel/wheel_gems.cpp \
            src/creatures/players/components/wheel/wheel_gems.hpp \
            src/io/functions/iologindata_load_player.cpp \
            src/server/network/protocol/protocolgame.cpp \
            tests/unit/players/CMakeLists.txt \
            tests/unit/players/oam_051_wheel_safety_adapt_test.cpp | sort)"
          changed="$({ git diff --name-only; git diff --cached --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          status=0
          {
            echo '--- git status --short ---'
            git status --short
            echo '--- unstaged paths ---'
            git diff --name-only
            echo '--- staged paths ---'
            git diff --cached --name-only
            echo '--- untracked paths ---'
            git ls-files --others --exclude-standard
            echo '--- combined paths ---'
            printf '%s\n' "$changed"
            echo '--- expected paths ---'
            printf '%s\n' "$expected"
            echo '--- unstaged diff check ---'
            git diff --check || status=1
            echo '--- staged diff check ---'
            git diff --cached --check || status=1
          } > /tmp/oam-051a-scope.log 2>&1
          if [ "$changed" != "$expected" ]; then
            status=1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve materializer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oam-051a-materializer-diagnostics
          path: /tmp/oam-051a-*.log
          if-no-files-found: error

      - name: Fail on scope error
        if: steps.materialize.outputs.status == '0' && steps.scope.outputs.status != '0'
        shell: bash
        run: |
          cat /tmp/oam-051a-scope.log
          exit 1

      - name: Commit bounded adaptation
        if: steps.materialize.outputs.status == '0' && steps.scope.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/creatures/players/components/wheel/player_wheel.cpp \
            src/creatures/players/components/wheel/player_wheel.hpp \
            src/creatures/players/components/wheel/wheel_gems.cpp \
            src/creatures/players/components/wheel/wheel_gems.hpp \
            src/io/functions/iologindata_load_player.cpp \
            src/server/network/protocol/protocolgame.cpp \
            tests/unit/players/CMakeLists.txt \
            tests/unit/players/oam_051_wheel_safety_adapt_test.cpp
          git diff --cached --check
          git commit -m "fix(wheel): adapt OAM-051A safety invariants"
          git push origin HEAD:dudantas/oam-051a-wheel-safety-adapt
