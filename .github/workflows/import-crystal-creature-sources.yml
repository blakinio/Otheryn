---
name: Import pinned Crystal creature sources

on:
  push:
    branches:
      - agent/oth-20260813-crystal-creature-sources
    paths:
      - .github/workflows/import-crystal-creature-sources.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CRYSTAL_COMMIT: 5e89bf8329ea406cb4ea8f4a18f32954f13e5418
      MONSTER_TREE: 28cddc06849455fae24c4c42799cbbe0db2c877b
      NPC_TREE: 01bc54abf2e54426ba1ec57f130fc14a3146f263
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: agent/oth-20260813-crystal-creature-sources
          fetch-depth: 1
      - name: Fetch exact CrystalServer revision
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/zimbadev/crystalserver.git /tmp/crystalserver
          git -C /tmp/crystalserver fetch --depth=1 origin "$CRYSTAL_COMMIT"
          git -C /tmp/crystalserver checkout --detach "$CRYSTAL_COMMIT"
          test "$(git -C /tmp/crystalserver rev-parse HEAD)" = "$CRYSTAL_COMMIT"
          test "$(git -C /tmp/crystalserver rev-parse HEAD:data-global/monster)" = "$MONSTER_TREE"
          test "$(git -C /tmp/crystalserver rev-parse HEAD:data-global/npc)" = "$NPC_TREE"
      - name: Import exact monster and NPC source trees
        run: |
          set -euo pipefail
          rm -rf vendor/map-analysis/crystalserver/data-global/monster vendor/map-analysis/crystalserver/data-global/npc
          mkdir -p vendor/map-analysis/crystalserver/data-global
          cp -a /tmp/crystalserver/data-global/monster vendor/map-analysis/crystalserver/data-global/monster
          cp -a /tmp/crystalserver/data-global/npc vendor/map-analysis/crystalserver/data-global/npc
          diff -qr /tmp/crystalserver/data-global/monster vendor/map-analysis/crystalserver/data-global/monster
          diff -qr /tmp/crystalserver/data-global/npc vendor/map-analysis/crystalserver/data-global/npc
      - name: Write deterministic source manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('vendor/map-analysis/crystalserver')
          rows = []
          for scope in ('data-global/monster', 'data-global/npc'):
              base = root / scope
              for path in sorted((p for p in base.rglob('*') if p.is_file()), key=lambda p: p.relative_to(root).as_posix()):
                  rows.append({'path': path.relative_to(root).as_posix(), 'size': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          canonical = json.dumps(rows, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          manifest = {'schemaVersion': 1, 'repository': 'zimbadev/crystalserver', 'commit': '5e89bf8329ea406cb4ea8f4a18f32954f13e5418', 'trees': {'data-global/monster': '28cddc06849455fae24c4c42799cbbe0db2c877b', 'data-global/npc': '01bc54abf2e54426ba1ec57f130fc14a3146f263'}, 'fileCount': len(rows), 'totalBytes': sum(row['size'] for row in rows), 'contentManifestSha256': hashlib.sha256(canonical).hexdigest(), 'files': rows}
          (root / 'creature-sources-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          print('files:', manifest['fileCount']); print('bytes:', manifest['totalBytes']); print('manifest sha256:', manifest['contentManifestSha256'])
          PY
      - name: Commit exact imported sources
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/map-analysis/crystalserver/data-global/monster vendor/map-analysis/crystalserver/data-global/npc vendor/map-analysis/crystalserver/creature-sources-manifest.json
          test -n "$(git status --porcelain)"
          git commit -m "chore(maps): vendor pinned Crystal creature sources"
          test "$(git rev-parse HEAD:vendor/map-analysis/crystalserver/data-global/monster)" = "$MONSTER_TREE"
          test "$(git rev-parse HEAD:vendor/map-analysis/crystalserver/data-global/npc)" = "$NPC_TREE"
          git push origin HEAD:agent/oth-20260813-crystal-creature-sources
