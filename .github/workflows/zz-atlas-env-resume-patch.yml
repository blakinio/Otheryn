name: Temporary Atlas Resume Patch
on:
  push:
    branches: [blakinio/atlas-environment-animation-resume]
    paths: [.github/workflows/zz-atlas-env-resume-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: blakinio/atlas-environment-animation-resume
      - name: Integrate resumable exporter and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/otbm_atlas/atlas.py')
          text = path.read_text(encoding='utf-8')
          old = 'from .environment_animation import enrich_environment_animations'
          new = 'from .environment_animation_resume import enrich_environment_animations_resumable as enrich_environment_animations'
          if old not in text:
              raise SystemExit('expected environment-animation import not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/zz-atlas-env-resume-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/otbm_atlas/atlas.py .github/workflows/zz-atlas-env-resume-patch.yml
          git commit -m 'feat(atlas): use resumable environment animation exporter'
          git push origin HEAD:blakinio/atlas-environment-animation-resume
