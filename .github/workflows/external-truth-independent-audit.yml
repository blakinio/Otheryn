name: External Truth Independent Audit

on:
  push:
    branches:
      - audit/otheryn-external-truth-source-enrichment-20260804
    paths:
      - docs/agents/evidence/OTERYN-20260804-external-truth-source-enrichment/independent_falsification.py
      - .github/workflows/external-truth-independent-audit.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - docs/agents/evidence/OTERYN-20260804-external-truth-source-enrichment/**
      - docs/agents/tasks/active/OTERYN-20260804-external-truth-source-enrichment.md
      - .github/workflows/external-truth-independent-audit.yml

permissions:
  contents: write

concurrency:
  group: external-truth-independent-audit-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  falsify:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'audit/otheryn-external-truth-source-enrichment-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/otheryn-external-truth-source-enrichment-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install independent parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Run independent falsification
        run: python docs/agents/evidence/OTERYN-20260804-external-truth-source-enrichment/independent_falsification.py
      - name: Commit independent evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/agents/evidence/OTERYN-20260804-external-truth-source-enrichment/independent-audit.md \
            docs/agents/evidence/OTERYN-20260804-external-truth-source-enrichment/independent-audit.json
          if git diff --cached --quiet; then
            echo "No independent-audit changes to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "audit: record independent falsification"
          git push origin HEAD:audit/otheryn-external-truth-source-enrichment-20260804
