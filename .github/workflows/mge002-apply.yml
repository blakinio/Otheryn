name: MGE-002 Apply

on:
  pull_request:
    paths:
      - '.github/mge002-payload/**'
      - '.github/workflows/mge002-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'dudantas/mge-002-typed-profile-snapshot' || github.ref == 'refs/heads/dudantas/mge-002-typed-profile-snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dudantas/mge-002-typed-profile-snapshot
          fetch-depth: 0
      - name: Verify and apply revision-bounded payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/mge002-payload/part00 | awk '{print $1}')" = "0dbcac80aa9313ad7653d2752d41b1a486693561bac49d7663f6cab72672de40"
          test "$(sha256sum .github/mge002-payload/part01 | awk '{print $1}')" = "147f8cf9daba7c0bc0cd2c369d5dceb12c52f2a3d03abd5ba1d397e01608a203"
          test "$(sha256sum .github/mge002-payload/part02 | awk '{print $1}')" = "cf9abec9e588a8003aa6fa4c9a447bf19c7bb95f222e75b6853bc2e00b902844"
          cat .github/mge002-payload/part00 .github/mge002-payload/part01 .github/mge002-payload/part02 > /tmp/mge002.b64
          test "$(sha256sum /tmp/mge002.b64 | awk '{print $1}')" = "e8b17d8439291ed7bd1ac42dbfe17688e5d1db90679d4ceea4f512c28d9df727"
          base64 --decode /tmp/mge002.b64 > /tmp/mge002.tar.gz
          test "$(sha256sum /tmp/mge002.tar.gz | awk '{print $1}')" = "621ca103fcfb7c2f7b5c23a133a7eb83ced5258f1681fe2b705a9b1cc4009d6c"
          python3 - <<'PY'
          import pathlib, tarfile
          expected = {
              'config.lua.dist',
              'src/config/game_profile.hpp',
              'src/config/configmanager.hpp',
              'src/config/configmanager.cpp',
              'src/canary_server.cpp',
              'src/server/network/protocol/protocol_profile.hpp',
              'src/server/network/protocol/protocol_profile.cpp',
              'src/server/network/protocol/protocol_port_utils.hpp',
              'tests/unit/config/CMakeLists.txt',
              'tests/unit/config/mge_002_game_profile_test.cpp',
              'vcproj/canary.vcxproj',
              'docs/architecture/typed-game-profile-snapshot.md',
              'docs/agents/tasks/active/OTH-20260726-mge002-typed-profile-snapshot.md',
          }
          with tarfile.open('/tmp/mge002.tar.gz', 'r:gz') as archive:
              names = {member.name for member in archive.getmembers() if member.isfile()}
              if names != expected:
                  raise SystemExit(f'unexpected payload paths: {sorted(names ^ expected)}')
              for member in archive.getmembers():
                  target = pathlib.PurePosixPath(member.name)
                  if target.is_absolute() or '..' in target.parts:
                      raise SystemExit(f'unsafe payload path: {member.name}')
              archive.extractall('.', filter='data')
          PY
          rm -rf .github/mge002-payload .github/workflows/mge002-apply.yml
          git add -A
          python3 - <<'PY'
          import subprocess
          expected = sorted([
              'config.lua.dist',
              'docs/agents/tasks/active/OTH-20260726-mge002-typed-profile-snapshot.md',
              'docs/architecture/typed-game-profile-snapshot.md',
              'src/canary_server.cpp',
              'src/config/configmanager.cpp',
              'src/config/configmanager.hpp',
              'src/config/game_profile.hpp',
              'src/server/network/protocol/protocol_port_utils.hpp',
              'src/server/network/protocol/protocol_profile.cpp',
              'src/server/network/protocol/protocol_profile.hpp',
              'tests/unit/config/CMakeLists.txt',
              'tests/unit/config/mge_002_game_profile_test.cpp',
              'vcproj/canary.vcxproj',
          ])
          actual = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', 'origin/main'], text=True
          ).splitlines()))
          if actual != expected:
              raise SystemExit(f'changed-path mismatch\nexpected={expected}\nactual={actual}')
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('vcproj/canary.vcxproj')
          PY
          python tools/agents/checkpoint.py docs/agents/tasks/active/OTH-20260726-mge002-typed-profile-snapshot.md --require-checkpoint
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(config): add typed startup game profile snapshot"
          git push origin HEAD:dudantas/mge-002-typed-profile-snapshot
