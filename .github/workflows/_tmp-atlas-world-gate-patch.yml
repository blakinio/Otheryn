---
name: TEMP Atlas world gate patch

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/_tmp-atlas-world-gate-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    name: Patch final world certification dependency gate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/OTH-20260817-atlas-github-synology-deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head with branch write capability
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Replace exact certification condition and remove this helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/otbm-atlas-full-world-16.yml')
          text = path.read_text(encoding='utf-8')
          old = "    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:full-world-16' || github.event.label.name == 'ci:full-world-32'))\n"
          new = "    if: always() && needs.shard.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:full-world-16' || github.event.label.name == 'ci:full-world-32')))\n"
          # There are multiple similarly shaped gates in the file; bind replacement
          # to the world job block so only the final certification dependency changes.
          marker = "  world:\n    name: Certify exact 3494-chunk full world\n    needs: shard\n"
          assert text.count(marker) == 1, 'world job marker is not unique'
          before, after = text.split(marker, 1)
          assert after.count(old) == 1, 'expected world certification condition not found exactly once after marker'
          after = after.replace(old, new, 1)
          path.write_text(before + marker + after, encoding='utf-8')
          Path('.github/workflows/_tmp-atlas-world-gate-patch.yml').unlink()
          PY
          git diff --check
          git diff -- .github/workflows/otbm-atlas-full-world-16.yml .github/workflows/_tmp-atlas-world-gate-patch.yml
      - name: Commit exact one-line workflow fix and self-delete helper
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/otbm-atlas-full-world-16.yml .github/workflows/_tmp-atlas-world-gate-patch.yml
          git commit -m 'fix(atlas): certify world after skipped receiver'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
