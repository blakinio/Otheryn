name: MGE-002 Reopened Apply

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'dudantas/mge-002-typed-profile-snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dudantas/mge-002-typed-profile-snapshot
          fetch-depth: 0
      - name: Apply and validate fixture compatibility
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/mge002-fixture-fix.py
          rm -f .github/mge002-fixture-fix.py
          rm -f .github/workflows/mge002-fixture-compat.yml
          rm -f .github/workflows/mge002-reopen-apply.yml
          git add -A
          git diff --cached --check
          python tools/agents/checkpoint.py docs/agents/tasks/active/OTH-20260726-mge002-typed-profile-snapshot.md --require-checkpoint
          python3 - <<'PY'
          import subprocess
          expected = sorted([
              'config.lua.dist',
              'docs/agents/tasks/active/OTH-20260726-mge002-typed-profile-snapshot.md',
              'docs/architecture/typed-game-profile-snapshot.md',
              'src/canary_server.cpp',
              'src/config/configmanager.cpp',
              'src/config/configmanager.hpp',
              'src/config/game_profile.hpp',
              'src/server/network/protocol/protocol_port_utils.hpp',
              'src/server/network/protocol/protocol_profile.cpp',
              'src/server/network/protocol/protocol_profile.hpp',
              'tests/shared/game/events_scheduler_test_fixture.hpp',
              'tests/shared/imbuements/imbuements_test_fixture.hpp',
              'tests/unit/config/CMakeLists.txt',
              'tests/unit/config/mge_002_game_profile_test.cpp',
              'vcproj/canary.vcxproj',
          ])
          actual = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', 'origin/main'], text=True
          ).splitlines()))
          if actual != expected:
              raise SystemExit(f'changed-path mismatch\nexpected={expected}\nactual={actual}')
          PY
          git commit -m "test(config): preserve fixture startup overrides"
          git push origin HEAD:dudantas/mge-002-typed-profile-snapshot
