---
name: OTBM Environment Animation E2E

on:
  pull_request:
    paths:
      - "tools/otbm_atlas/**"
      - ".github/workflows/otbm-environment-animation-tests.yml"

permissions:
  contents: read

jobs:
  browser:
    name: Environment animation browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Install Chromium harness
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install --with-deps chromium
      - name: Build deterministic animation fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.otbm_atlas.assets import encode_png
          from tools.otbm_atlas.viewer import write_viewer
          root=Path('/tmp/environment-e2e');(root/'tiles/z7').mkdir(parents=True);(root/'data/environment-animations/chunks/z7').mkdir(parents=True);(root/'data/environment-animations/frames/demo').mkdir(parents=True);(root/'data/environment-animations/underlays/z7/0_0').mkdir(parents=True);(root/'data').mkdir(exist_ok=True)
          def image(rgb):return encode_png(32,32,bytes((*rgb,255))*32*32)
          (root/'tiles/z7/0_0.png').write_bytes(image((20,20,20)));(root/'data/environment-animations/frames/demo/0.png').write_bytes(image((255,0,0)));(root/'data/environment-animations/frames/demo/1.png').write_bytes(image((0,255,0)));(root/'data/environment-animations/underlays/z7/0_0/100_100_1.png').write_bytes(image((20,20,20)))
          chunk={'z':7,'chunkX':0,'chunkY':0,'logicalBounds':[0,127,0,127,7],'bounds':[100,100,100,100,7],'path':'tiles/z7/0_0.png','overviewPath':'tiles/z7/0_0.png','lowOverviewPath':'tiles/z7/0_0.png','imageWidth':32,'imageHeight':32}
          (root/'manifest.json').write_text(json.dumps({'schemaVersion':3,'chunkSize':128,'chunks':[chunk]}),encoding='utf-8');(root/'data/search-index.json').write_text('{"records":[]}',encoding='utf-8');(root/'data/environment-animations/index.json').write_text(json.dumps({'schemaVersion':1,'animationZoom':1.5}),encoding='utf-8')
          record={'position':{'x':100,'y':100,'z':7},'serverId':1,'animationKey':'demo','frames':['data/environment-animations/frames/demo/0.png','data/environment-animations/frames/demo/1.png'],'underlay':'data/environment-animations/underlays/z7/0_0/100_100_1.png','phaseDurationsMs':[150,150],'defaultStartPhase':0,'synchronized':True,'loopType':0,'loopCount':0}
          (root/'data/environment-animations/chunks/z7/0_0.json').write_text(json.dumps({'schemaVersion':1,'records':[record]}),encoding='utf-8');write_viewer(root)
          PY
      - name: Prove phase changes in Chromium
        run: |
          python3 -m http.server 8124 --directory /tmp/environment-e2e >/tmp/environment-http.log 2>&1 &
          pid=$!; trap 'kill "$pid" || true' EXIT
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True);page=browser.new_page(viewport={'width':800,'height':600});page.goto('http://127.0.0.1:8124/?x=100&y=100&z=7&zoom=2&render=detailed',wait_until='networkidle');page.locator('#environmentAnimations').wait_for(state='attached');page.wait_for_timeout(400)
              colors=[]
              for _ in range(8):
                  colors.append(tuple(page.evaluate("""() => {const c=document.querySelector('#environmentAnimations'),x=Math.floor(c.width/2+32),y=Math.floor(c.height/2+32);return [...c.getContext('2d').getImageData(x,y,1,1).data.slice(0,3)]}""")));page.wait_for_timeout(170)
              browser.close()
          assert (255,0,0) in colors,colors
          assert (0,255,0) in colors,colors
          print({'journey':'PASS','colors':colors})
          PY
