name: MGE-002 Sync Main

on:
  push:
    branches:
      - dudantas/mge-002-typed-profile-snapshot
    paths:
      - .github/workflows/mge002-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dudantas/mge-002-typed-profile-snapshot
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/mge002-sync-main.yml
          git commit -m "chore(mge): synchronize current main"
          git push origin HEAD:dudantas/mge-002-typed-profile-snapshot
