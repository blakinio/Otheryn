name: Atlas Runtime After Copy One Shot

on:
  push:
    branches:
      - ops/atlas-runtime-after-copy-20260816
    paths:
      - .github/workflows/atlas-runtime-after-copy-one-shot.yml

permissions:
  contents: read

concurrency:
  group: atlas-runtime-after-copy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify copied Atlas and start private runtime
    runs-on: [ots, synology]
    timeout-minutes: 25
    steps:
      - name: Checkout exact repository tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Verify dedicated Synology runner and corpus identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == "synology-ots-01" ]]
          docker version >/dev/null
          docker info >/dev/null
          image=python:3.12-alpine
          docker pull "$image" >/dev/null
          docker run --rm --name "atlas-copy-verify-${GITHUB_RUN_ID}" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v /volume1/docker:/nas:ro \
            -w /repo -e PYTHONPATH=/repo "$image" sh -lc '
              set -eu
              root=/nas/oteryn/atlas/current
              test -f "$root/manifest.json"
              test -d "$root/tiles"
              test -d "$root/overview"
              test -d "$root/overview-low"
              test -d "$root/data"
              python - <<"PY"
          import json
          from pathlib import Path
          root=Path("/nas/oteryn/atlas/current")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          chunks=manifest.get("chunks",[])
          floors=sorted({int(c["z"]) for c in chunks})
          sources=manifest.get("sources",{})
          assert manifest.get("schemaVersion")==3, manifest.get("schemaVersion")
          assert manifest.get("chunkSize")==128, manifest.get("chunkSize")
          assert len(chunks)==3494, len(chunks)
          assert floors==list(range(16)), floors
          assert sources.get("mapSha256")=="3bd40d14fefec41f24c4b3ae879e420be1a831ef55b95dcbec721e587a09b034", sources.get("mapSha256")
          assert sources.get("assetsSha256") in {
              "4c78aa441bc6eed6a614092423a58dc6275cf2c36ea5d4bde13746c9b4ee7ee7",
              "4d11c5be0438c8fa08d079a558fe99f5f28d3db5df0aa742c5a46d4260c905c2",
          }, sources.get("assetsSha256")
          print("ATLAS_IDENTITY=PASS")
          print("ATLAS_CHUNKS=3494")
          print("ATLAS_FLOORS=Z0..Z15")
          print("SPOOL_PRESENT=" + str((root/".spool").is_dir()).lower())
          print("ENV_INDEX_PRESENT=" + str((root/"data/environment-animations/index.json").is_file()).lower())
          PY
              python -m tools.otbm_atlas.verify "$root" --output /tmp/verification-copy.json
              python - <<"PY"
          import json
          r=json.load(open("/tmp/verification-copy.json",encoding="utf-8"))
          assert r["ok"] is True, r["errors"][:20]
          assert r["chunks"]==3494, r["chunks"]
          print("INDEPENDENT_CORPUS_VERIFY=PASS")
          print("MISSING_SPRITES=" + str(sum(r.get("missingSprites",{}).values())))
          PY
            '

      - name: Refresh only dependency-free viewer runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          image=python:3.12-alpine
          docker run --rm --name "atlas-viewer-refresh-${GITHUB_RUN_ID}" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v /volume1/docker:/nas \
            -w /repo -e PYTHONPATH=/repo "$image" sh -lc '
              set -eu
              python -c "from tools.otbm_atlas.viewer import write_viewer; write_viewer(\"/nas/oteryn/atlas/current\")"
              test -f /nas/oteryn/atlas/current/index.html
              test -f /nas/oteryn/atlas/current/viewer-app.js
              test -f /nas/oteryn/atlas/current/viewer-runtime.js
              test -f /nas/oteryn/atlas/current/creature-animation-runtime.js
              echo VIEWER_ONLY_REFRESH=PASS
            '

      - name: Run deployment preflight after viewer refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          image=python:3.12-alpine
          docker run --rm --name "atlas-preflight-${GITHUB_RUN_ID}" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v /volume1/docker:/nas:ro \
            -w /repo -e PYTHONPATH=/repo "$image" sh -lc '
              set -eu
              python -m tools.otbm_atlas.deploy_preflight /nas/oteryn/atlas/current --output /tmp/deploy-preflight.json
              python - <<"PY"
          import json
          r=json.load(open("/tmp/deploy-preflight.json",encoding="utf-8"))
          assert r["corePreviewReady"] is True, r["errors"][:20]
          print("DEPLOYMENT_PREFLIGHT=" + r["status"])
          print("CORE_PREVIEW_READY=true")
          print("FULL_RUNTIME_READY=" + str(bool(r["fullRuntimeReady"])).lower())
          print("ENVIRONMENT_ANIMATIONS=" + str(r["environmentAnimations"].get("status")))
          print("CREATURES=" + str(r["creatures"].get("status")))
          PY
            '

      - name: Stage corrected Oteryn project files on NAS
        shell: bash
        run: |
          set -Eeuo pipefail
          image=alpine:3.22
          docker pull "$image" >/dev/null
          tar -C "$GITHUB_WORKSPACE/deploy/otbm-atlas-synology" -cf - compose.yaml nginx.conf | \
            docker run --rm -i --name "atlas-project-stage-${GITHUB_RUN_ID}" \
              -v /volume1/docker:/nas "$image" sh -lc '
                set -eu
                target=/nas/oteryn/atlas/project
                mkdir -p "$target"
                tar -xf - -C "$target"
                cp "$target/compose.yaml" "$target/docker-compose.yml"
                cat > "$target/.env" <<"EOF"
          ATLAS_DATA_DIR=/volume1/docker/oteryn/atlas/current
          ATLAS_BIND_ADDRESS=127.0.0.1
          ATLAS_HTTP_PORT=8095
          EOF
                chmod 0644 "$target/compose.yaml" "$target/docker-compose.yml" "$target/nginx.conf" "$target/.env"
                echo PROJECT_PATH=/volume1/docker/oteryn/atlas/project
              '

      - name: Assert private host port is not already allocated
        shell: bash
        run: |
          set -Eeuo pipefail
          if docker ps --format '{{.Names}} {{.Ports}}' | grep -E '(^|[,:])127\.0\.0\.1:8095->|(^|[,:])0\.0\.0\.0:8095->|(^|[,:])\[::\]:8095->' ; then
            echo 'Port 8095 is already allocated by a running container.' >&2
            exit 1
          fi
          echo HOST_PORT_8095_CONTAINER_CONFLICT=false

      - name: Start Atlas compose project from Synology host path
        shell: bash
        run: |
          set -Eeuo pipefail
          image=docker:27-cli
          docker pull "$image" >/dev/null
          docker run --rm --name "atlas-compose-${GITHUB_RUN_ID}" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /volume1/docker/oteryn/atlas/project:/volume1/docker/oteryn/atlas/project:ro \
            -w /volume1/docker/oteryn/atlas/project "$image" sh -lc '
              set -eu
              docker compose version
              docker compose --env-file .env -f docker-compose.yml config >/tmp/atlas-compose-rendered.yml
              grep -F "/volume1/docker/oteryn/atlas/current:/usr/share/nginx/html:ro" /tmp/atlas-compose-rendered.yml >/dev/null
              docker compose --env-file .env -f docker-compose.yml up -d --pull always
            '

      - name: Wait for healthy runtime and verify HTTP contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cid="$(docker ps -aq --filter 'label=com.docker.compose.project=otheryn-atlas-preview' --filter 'label=com.docker.compose.service=atlas' | head -n1)"
          test -n "$cid"
          for _ in $(seq 1 45); do
            status="$(docker inspect -f '{{.State.Status}}' "$cid")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"
            echo "container_status=$status health=$health"
            [[ "$health" == healthy ]] && break
            [[ "$status" == exited || "$health" == unhealthy ]] && { docker logs "$cid"; exit 1; }
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy
          image=alpine:3.22
          body="$(docker run --rm --network host "$image" sh -lc 'wget -qO- http://127.0.0.1:8095/healthz')"
          test "$body" = ok
          code="$(docker run --rm --network host "$image" sh -lc 'wget -S -O /dev/null http://127.0.0.1:8095/index.html 2>&1 | awk '\''/HTTP\//{print $2; exit}'\''')"
          test "$code" = 200
          missing="$(docker run --rm --network host "$image" sh -lc 'wget -S -O /dev/null http://127.0.0.1:8095/__missing__.json 2>&1 | awk '\''/HTTP\//{print $2; exit}'\'' || true')"
          test "$missing" = 404
          echo ATLAS_CONTAINER=healthy
          echo ATLAS_LOCAL_HTTP=http://127.0.0.1:8095/
          echo ATLAS_HTTP_CONTRACT=PASS

      - name: Verify runtime security and read-only corpus mount
        shell: bash
        run: |
          set -Eeuo pipefail
          cid="$(docker ps -q --filter 'label=com.docker.compose.project=otheryn-atlas-preview' --filter 'label=com.docker.compose.service=atlas' | head -n1)"
          docker inspect "$cid" > /tmp/atlas-runtime-inspect.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/atlas-runtime-inspect.json'))[0]
          h=d['HostConfig']
          assert h['ReadonlyRootfs'] is True
          assert 'ALL' in (h.get('CapDrop') or [])
          assert any(x.startswith('no-new-privileges') for x in (h.get('SecurityOpt') or []))
          mounts={m['Destination']:m for m in d['Mounts']}
          assert mounts['/usr/share/nginx/html']['RW'] is False
          assert mounts['/usr/share/nginx/html']['Source']=='/volume1/docker/oteryn/atlas/current', mounts['/usr/share/nginx/html']['Source']
          binding=h['PortBindings']['8080/tcp'][0]
          assert binding['HostIp']=='127.0.0.1', binding
          assert binding['HostPort']=='8095', binding
          print('RUNTIME_SECURITY=PASS')
          print('RUNTIME_DATA_MOUNT=/volume1/docker/oteryn/atlas/current:ro')
          print('RUNTIME_BIND=127.0.0.1:8095')
          PY
