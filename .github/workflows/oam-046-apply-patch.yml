name: OAM-046 exact configuration patch

on:
  push:
    branches:
      - dudantas/oam-046-configuration-adapt
    paths:
      - .github/workflows/oam-046-apply-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dudantas/oam-046-configuration-adapt
          fetch-depth: 0
      - name: Apply bounded source replacement
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/config/configmanager.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''void ConfigManager::loadLuaOTCFeatures(lua_State* L) {
          \tlua_getglobal(L, "OTCRFeatures");
          \tif (!lua_istable(L, -1)) {
          \t\t// Temp to avoid a bug in OTC if the "OTCRFeatures" array is not declared in config.lua.
          \t\tenabledFeaturesOTC.push_back(101);
          \t\tenabledFeaturesOTC.push_back(102);
          \t\tenabledFeaturesOTC.push_back(103);
          \t\tenabledFeaturesOTC.push_back(118);
          \t\tlua_pop(L, 1);
          \t\treturn;
          \t}

          \tlua_pushstring(L, "enableFeature");
          \tlua_gettable(L, -2);
          \tif (lua_istable(L, -1)) {
          \t\tlua_pushnil(L);
          \t\twhile (lua_next(L, -2) != 0) {
          \t\t\tconst auto feature = static_cast<uint8_t>(lua_tointeger(L, -1));
          \t\t\tenabledFeaturesOTC.push_back(feature);
          \t\t\tlua_pop(L, 1);
          \t\t}
          \t}
          \tlua_pop(L, 1);

          \tlua_pushstring(L, "disableFeature");
          \tlua_gettable(L, -2);
          \tif (lua_istable(L, -1)) {
          \t\tlua_pushnil(L);
          \t\twhile (lua_next(L, -2) != 0) {
          \t\t\tconst auto feature = static_cast<uint8_t>(lua_tointeger(L, -1));
          \t\t\tdisabledFeaturesOTC.push_back(feature);
          \t\t\tlua_pop(L, 1);
          \t\t}
          \t}
          \tlua_pop(L, 1);

          \tlua_pop(L, 1);
          }
          '''
          new = '''void ConfigManager::loadLuaOTCFeatures(lua_State* L) {
          \tOTCFeatures enabledFeatures;
          \tOTCFeatures disabledFeatures;

          \tlua_getglobal(L, "OTCRFeatures");
          \tif (!lua_istable(L, -1)) {
          \t\t// Temp to avoid a bug in OTC if the "OTCRFeatures" array is not declared in config.lua.
          \t\tenabledFeatures = { 101, 102, 103, 118 };
          \t\tlua_pop(L, 1);
          \t} else {
          \t\tlua_pushstring(L, "enableFeature");
          \t\tlua_gettable(L, -2);
          \t\tif (lua_istable(L, -1)) {
          \t\t\tlua_pushnil(L);
          \t\t\twhile (lua_next(L, -2) != 0) {
          \t\t\t\tconst auto feature = static_cast<uint8_t>(lua_tointeger(L, -1));
          \t\t\t\tenabledFeatures.push_back(feature);
          \t\t\t\tlua_pop(L, 1);
          \t\t\t}
          \t\t}
          \t\tlua_pop(L, 1);

          \t\tlua_pushstring(L, "disableFeature");
          \t\tlua_gettable(L, -2);
          \t\tif (lua_istable(L, -1)) {
          \t\t\tlua_pushnil(L);
          \t\t\twhile (lua_next(L, -2) != 0) {
          \t\t\t\tconst auto feature = static_cast<uint8_t>(lua_tointeger(L, -1));
          \t\t\t\tdisabledFeatures.push_back(feature);
          \t\t\t\tlua_pop(L, 1);
          \t\t\t}
          \t\t}
          \t\tlua_pop(L, 1);
          \t\tlua_pop(L, 1);
          \t}

          \tenabledFeaturesOTC = std::move(enabledFeatures);
          \tdisabledFeaturesOTC = std::move(disabledFeatures);
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one source match, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit source-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oam-046-apply-patch.yml
          git add src/config/configmanager.cpp
          git commit -m "fix(oam): replace OTCR feature snapshots on load"
          git push origin HEAD:dudantas/oam-046-configuration-adapt
