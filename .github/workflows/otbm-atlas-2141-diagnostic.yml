---
name: OTBM Atlas Appearance 2141 Diagnostic

on:
  push:
    branches:
      - agent/oth-20260813-full-otbm-atlas-current-main
    paths:
      - ".github/workflows/otbm-atlas-2141-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Locate canonical OTBM item and inspect pinned sources
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.otbm_atlas.assets import load_object_appearances
          from tools.otbm_atlas.semantic import Item, Tile, iter_map_records, walk_items

          target = 2141
          map_path = Path('vendor/map-analysis/crystalserver/data-global/world/world.otbm')
          occurrences = []
          for record in iter_map_records(map_path, strict=True):
              if not isinstance(record, Tile):
                  continue
              visible = ([] if record.ground is None else [('ground', record.ground)]) + [('tile', item) for item in record.items]
              for slot, item in visible:
                  if item.server_id == target:
                      occurrences.append({'position': {'x': record.position.x, 'y': record.position.y, 'z': record.position.z}, 'slot': slot, 'subtype': item.subtype, 'actionId': item.action_id, 'uniqueId': item.unique_id})
              for item in walk_items(record.items):
                  if item.server_id == target and item not in record.items:
                      occurrences.append({'position': {'x': record.position.x, 'y': record.position.y, 'z': record.position.z}, 'slot': 'child', 'subtype': item.subtype, 'actionId': item.action_id, 'uniqueId': item.unique_id})
          asset_dir = Path('vendor/map-analysis/tibia-client/15.25.bd5a04/assets')
          tibia_path = next(asset_dir.glob('appearances-*.dat'))
          tibia = load_object_appearances(tibia_path)
          print(json.dumps({'target': target, 'occurrences': occurrences, 'tibia1525HasAppearance': target in tibia, 'nearbyTibiaAppearanceIds': [value for value in range(target-3, target+4) if value in tibia]}, sort_keys=True))
          assert len(occurrences) == 1, occurrences
          PY
          curl -fsSL https://raw.githubusercontent.com/zimbadev/crystalserver/5e89bf8329ea406cb4ea8f4a18f32954f13e5418/data/items/items.xml -o /tmp/crystal-items.xml
          curl -fsSL https://raw.githubusercontent.com/zimbadev/crystalserver/5e89bf8329ea406cb4ea8f4a18f32954f13e5418/data/items/appearances.dat -o /tmp/crystal-appearances.dat
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from tools.otbm_atlas.assets import load_object_appearances

          target = 2141
          text = Path('/tmp/crystal-items.xml').read_text(encoding='utf-8')
          patterns = [
              rf'<item\s+id="{target}"[^>]*?(?:/>|>.*?</item>)',
              rf'<item\s+fromid="{target}"\s+toid="{target}"[^>]*?(?:/>|>.*?</item>)',
          ]
          matches = []
          for pattern in patterns:
              matches.extend(re.findall(pattern, text, flags=re.S))
          crystal = load_object_appearances(Path('/tmp/crystal-appearances.dat'))
          print(json.dumps({'crystalPinnedHasAppearance': target in crystal, 'nearbyCrystalAppearanceIds': [value for value in range(target-3, target+4) if value in crystal], 'itemsXmlMatches': matches[:4]}, sort_keys=True))
          PY
