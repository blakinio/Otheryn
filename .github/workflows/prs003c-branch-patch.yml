name: PRS-003C branch patch

on:
  push:
    branches:
      - dudantas/prs-003c-live-protocol-wiring
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: dudantas/prs-003c-live-protocol-wiring
          fetch-depth: 0

      - name: Apply exact protocol replacements
        run: python3 tools/agents/patches/apply_prs003c_live_protocol_wiring.py

      - name: Remove branch-only patch machinery
        run: |
          rm tools/agents/patches/prs003c-live-protocol-wiring.patch
          rm tools/agents/patches/apply_prs003c_live_protocol_wiring.py
          rm .github/workflows/prs003c-branch-patch.yml

      - name: Commit patched protocol call sites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/network/protocol/protocollogin.cpp \
                  src/server/network/protocol/protocolgame.cpp \
                  tools/agents/patches/prs003c-live-protocol-wiring.patch \
                  tools/agents/patches/apply_prs003c_live_protocol_wiring.py \
                  .github/workflows/prs003c-branch-patch.yml
          git commit -m "feat(resilience): wire outage admission into live protocols"
          git push origin HEAD:dudantas/prs-003c-live-protocol-wiring
