name: OAM 046 bootstrap

on:
  push:
    branches:
      - dudantas/oam-046-configuration-adapt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize bounded target adaptation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("src/config/configmanager.cpp")
          source = source_path.read_text(encoding="utf-8")
          replacement = r'''void ConfigManager::loadLuaOTCFeatures(lua_State* L) {
          	OTCFeatures nextEnabledFeatures;
          	OTCFeatures nextDisabledFeatures;

          	lua_getglobal(L, "OTCRFeatures");
          	if (!lua_istable(L, -1)) {
          		// Temp to avoid a bug in OTC if the "OTCRFeatures" array is not declared in config.lua.
          		nextEnabledFeatures = { 101, 102, 103, 118 };
          		lua_pop(L, 1);
          		enabledFeaturesOTC = std::move(nextEnabledFeatures);
          		disabledFeaturesOTC = std::move(nextDisabledFeatures);
          		return;
          	}

          	lua_pushstring(L, "enableFeature");
          	lua_gettable(L, -2);
          	if (lua_istable(L, -1)) {
          		lua_pushnil(L);
          		while (lua_next(L, -2) != 0) {
          			const auto feature = static_cast<uint8_t>(lua_tointeger(L, -1));
          			nextEnabledFeatures.push_back(feature);
          			lua_pop(L, 1);
          		}
          	}
          	lua_pop(L, 1);

          	lua_pushstring(L, "disableFeature");
          	lua_gettable(L, -2);
          	if (lua_istable(L, -1)) {
          		lua_pushnil(L);
          		while (lua_next(L, -2) != 0) {
          			const auto feature = static_cast<uint8_t>(lua_tointeger(L, -1));
          			nextDisabledFeatures.push_back(feature);
          			lua_pop(L, 1);
          		}
          	}
          	lua_pop(L, 1);

          	lua_pop(L, 1);
          	enabledFeaturesOTC = std::move(nextEnabledFeatures);
          	disabledFeaturesOTC = std::move(nextDisabledFeatures);
          }
          OTCFeatures ConfigManager::getEnabledFeaturesOTC() const {'''
          pattern = r"void ConfigManager::loadLuaOTCFeatures\(lua_State\* L\) \{.*?\n\}\nOTCFeatures ConfigManager::getEnabledFeaturesOTC\(\) const \{"
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f"expected one loadLuaOTCFeatures replacement, got {count}")
          source_path.write_text(source, encoding="utf-8")

          cmake_path = Path("tests/unit/server/CMakeLists.txt")
          cmake = cmake_path.read_text(encoding="utf-8")
          test_entry = "            config/oam_046_configuration_snapshot_test.cpp\n"
          if test_entry not in cmake:
              cmake = cmake.replace(
                  "    PRIVATE network/message/networkmessage_test.cpp\n",
                  "    PRIVATE config/oam_046_configuration_snapshot_test.cpp\n            network/message/networkmessage_test.cpp\n",
                  1,
              )
          cmake_path.write_text(cmake, encoding="utf-8")

          test_path = Path("tests/unit/server/config/oam_046_configuration_snapshot_test.cpp")
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(r'''#include "config/configmanager.hpp"

#ifndef USE_PRECOMPILED_HEADERS
	#include <algorithm>
	#include <atomic>
	#include <filesystem>
	#include <fstream>
	#include <stdexcept>
	#include <string>
	#include <string_view>
#endif

namespace {
	class TemporaryLuaConfig {
	public:
		TemporaryLuaConfig() : path(std::filesystem::temp_directory_path() / ("oam_046_configuration_" + std::to_string(sequence.fetch_add(1)) + ".lua")) { }

		~TemporaryLuaConfig() {
			std::error_code error;
			std::filesystem::remove(path, error);
		}

		void write(const std::string_view content) const {
			std::ofstream output(path, std::ios::trunc);
			if (!output) {
				throw std::runtime_error("failed to create temporary Lua configuration");
			}
			output << content;
			if (!output) {
				throw std::runtime_error("failed to write temporary Lua configuration");
			}
		}

		[[nodiscard]] std::string string() const {
			return path.string();
		}

	private:
		inline static std::atomic_uint64_t sequence = 0;
		std::filesystem::path path;
	};

	OTCFeatures sorted(OTCFeatures features) {
		std::ranges::sort(features);
		return features;
	}
}

TEST(Oam046ConfigurationSnapshotTest, SuccessfulLoadsReplaceEnabledAndDisabledFeatureSnapshots) {
	TemporaryLuaConfig file;
	ConfigManager config;
	config.setConfigFileLua(file.string());

	file.write(R"(
OTCRFeatures = {
	enableFeature = { 101, 102 },
	disableFeature = { 201 }
}
)");
	ASSERT_TRUE(config.load());
	EXPECT_EQ((OTCFeatures { 101, 102 }), sorted(config.getEnabledFeaturesOTC()));
	EXPECT_EQ((OTCFeatures { 201 }), sorted(config.getDisabledFeaturesOTC()));

	file.write(R"(
OTCRFeatures = {
	enableFeature = { 118 },
	disableFeature = { 202, 203 }
}
)");
	ASSERT_TRUE(config.load());
	EXPECT_EQ((OTCFeatures { 118 }), sorted(config.getEnabledFeaturesOTC()));
	EXPECT_EQ((OTCFeatures { 202, 203 }), sorted(config.getDisabledFeaturesOTC()));
}

TEST(Oam046ConfigurationSnapshotTest, EmptyFeatureTablesClearThePreviousSnapshot) {
	TemporaryLuaConfig file;
	ConfigManager config;
	config.setConfigFileLua(file.string());

	file.write("OTCRFeatures = { enableFeature = { 101 }, disableFeature = { 201 } }\n");
	ASSERT_TRUE(config.load());

	file.write("OTCRFeatures = { enableFeature = {}, disableFeature = {} }\n");
	ASSERT_TRUE(config.load());
	EXPECT_TRUE(config.getEnabledFeaturesOTC().empty());
	EXPECT_TRUE(config.getDisabledFeaturesOTC().empty());
}

TEST(Oam046ConfigurationSnapshotTest, MissingFeatureTableReplacesTheSnapshotWithBoundedDefaults) {
	TemporaryLuaConfig file;
	ConfigManager config;
	config.setConfigFileLua(file.string());

	file.write("OTCRFeatures = { enableFeature = { 77 }, disableFeature = { 88 } }\n");
	ASSERT_TRUE(config.load());

	file.write("serverName = 'OAM-046'\n");
	ASSERT_TRUE(config.load());
	EXPECT_EQ((OTCFeatures { 101, 102, 103, 118 }), sorted(config.getEnabledFeaturesOTC()));
	EXPECT_TRUE(config.getDisabledFeaturesOTC().empty());
}

TEST(Oam046ConfigurationSnapshotTest, FailedLoadPreservesTheLastSuccessfulFeatureSnapshot) {
	TemporaryLuaConfig file;
	ConfigManager config;
	config.setConfigFileLua(file.string());

	file.write("OTCRFeatures = { enableFeature = { 101 }, disableFeature = { 201 } }\n");
	ASSERT_TRUE(config.load());

	file.write("OTCRFeatures = {\n");
	EXPECT_FALSE(config.load());
	EXPECT_EQ((OTCFeatures { 101 }), config.getEnabledFeaturesOTC());
	EXPECT_EQ((OTCFeatures { 201 }), config.getDisabledFeaturesOTC());
}
''', encoding="utf-8")

          proof_path = Path("docs/oam-046-configuration-adapt.md")
          proof_path.write_text(r'''# OAM-046 Configuration target proof

Final disposition: `configuration → ADAPT`.

## Exact baselines

- Canary preflight PR #911 merged as `a1af14078de0450eb138a2f087e71104c03da4ca`.
- Otheryn task-start main: `e8f683e61427e9967cbc180b837220d4b7487d85`.
- reviewed current upstream: `opentibiabr/canary@7323503b3dc61ed86bf1f04a611b2d0aec64b35a`.
- target `configmanager.hpp`: blob `c3027c491cbc326a3f66d2ed39a19ad7856ca6cf`.
- target pre-adaptation `configmanager.cpp`: blob `48c0637ba870cb25d119c16fc21d4134d6bdac15`.
- target/upstream `config_enums.hpp`: blob `1676d0ac445e4cd83e91fc57ca405b4a0dccfb55`.
- target `config.lua.dist`: blob `add3df239fb22592b7c63d166f880d0c31098ba2`.

## Isolated target defect

`ConfigManager::loadLuaOTCFeatures()` appended parsed or fallback IDs directly to the retained enabled/disabled vectors. Every later successful load therefore accumulated duplicates and preserved IDs removed from the newer configuration. Empty feature tables could not clear the previous snapshot.

## Bounded adaptation

Each successful load now builds local enabled/disabled vectors and replaces both retained vectors only after the complete `OTCRFeatures` table is parsed. A missing table atomically replaces the snapshot with the existing bounded enabled defaults `{101, 102, 103, 118}` and an empty disabled list. A Lua file that fails before parsing leaves the last successful snapshot unchanged.

Focused fixtures cover:

- replacement of enabled and disabled snapshots across two successful loads;
- clearing through valid empty tables;
- replacement with the existing fallback defaults when `OTCRFeatures` is absent;
- preservation of the last successful snapshot after Lua syntax failure.

## Explicit boundaries

This package does not claim:

- exhaustive correspondence for every configuration key or default;
- feature behavior controlled by configuration values;
- maintained-client interpretation or physical-client effects of every feature ID;
- production configuration correctness, secret management or environment policy;
- concurrent reload safety, reader synchronization or atomic replacement of the complete configuration map;
- generic cache invalidation, callback ordering, protocol correctness or gameplay parity.

## Remaining unknowns

Concurrent reload/read behavior, complete cache synchronization, production environment configuration and exhaustive key/default parity remain `UNKNOWN`.

`next_action`: open the Otheryn feature PR, require exact-head Autofix, CI and Required, audit discussions and target-main drift, then squash-merge with the expected head.
''', encoding="utf-8")

