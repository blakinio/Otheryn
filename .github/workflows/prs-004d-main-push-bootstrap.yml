name: PRS-004D Guarded Final Save Repair

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prs-004d-guarded-final-save-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify trusted trigger
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf 'pr=%s head_repo=%s head_ref=%s expected_repo=%s\n' "$PR_NUMBER" "$HEAD_REPOSITORY" "$HEAD_REF" "$EXPECTED_REPOSITORY"
          [[ "$PR_NUMBER" == "347" ]]
          [[ "$HEAD_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$HEAD_REF" == "dudantas/prs-004d-final-save-repair-trigger" ]]

      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: dudantas/prs-004d-protected-player-save
          fetch-depth: 0

      - name: Repair final release boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/game/scheduling/save_manager.cpp')
          text = path.read_text(encoding='utf-8')

          old_attempt = '''\t\tconst auto attempt = executePlayerCheckpointAttempt(*state, *generation, [this, &player] {
\t\t\treturn doSavePlayer(player, true);
\t\t});'''
          new_attempt = '''\t\tconst auto attempt = executePlayerCheckpointAttempt(*state, *generation, [this, &player] {
\t\t\treturn doSavePlayer(player, false);
\t\t});'''
          old_success = '''\t\tif (!attempt.followUpRequired && !state->isDirty()) {
\t\t\treturn true;
\t\t}'''
          new_success = '''\t\tif (!attempt.followUpRequired && !state->isDirty()) {
\t\t\tif (!releasePlayerWriterFence(player)) {
\t\t\t\tlogger.error("Final save for player {} committed but durable writer-fence release failed.", player->getName());
\t\t\t\treturn false;
\t\t\t}
\t\t\treturn true;
\t\t}'''

          if new_attempt in text and new_success in text:
              Path('/tmp/already-applied').write_text('yes', encoding='utf-8')
          else:
              if text.count(old_attempt) != 1 or text.count(old_success) != 1:
                  raise SystemExit('final-save repair markers are neither pristine nor fully repaired')
              path.write_text(text.replace(old_attempt, new_attempt, 1).replace(old_success, new_success, 1), encoding='utf-8')
          PY

      - name: Commit repair when needed
        run: |
          if [[ -f /tmp/already-applied ]]; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/scheduling/save_manager.cpp
          git diff --cached --check
          git commit -m "fix(resilience): release writer fence after final checkpoint"
          git push origin HEAD:dudantas/prs-004d-protected-player-save
