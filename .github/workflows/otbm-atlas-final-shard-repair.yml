---
name: OTBM Atlas Final Shard Repair

on:
  push:
    branches:
      - agent/oth-20260813-full-otbm-atlas-current-main
    paths:
      - ".github/workflows/otbm-atlas-final-shard-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: agent/oth-20260813-full-otbm-atlas-current-main
          persist-credentials: true
      - name: Replace four-floor shards with one-floor shards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/otbm-atlas-tests.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      matrix:\n        include:\n          - shard: 0\n            floors: "0,1,2,3"\n          - shard: 1\n            floors: "4,5,6,7"\n          - shard: 2\n            floors: "8,9,10,11"\n          - shard: 3\n            floors: "12,13,14,15"\n'''
          entries = ''.join(f'          - shard: {floor}\\n            floors: "{floor}"\\n' for floor in range(16)).replace('\\n', '\n')
          new = '      matrix:\n        include:\n' + entries
          assert text.count(old) == 1, 'expected four-shard matrix not found exactly once'
          text = text.replace(old, new, 1)
          assert text.count('assert len(paths) == 4, paths') == 1
          text = text.replace('assert len(paths) == 4, paths', 'assert len(paths) == 16, paths', 1)
          old_shards = "assert sorted(report['shard'] for report in reports) == [0, 1, 2, 3]"
          assert text.count(old_shards) == 1
          text = text.replace(old_shards, "assert sorted(report['shard'] for report in reports) == list(range(16))", 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/otbm-atlas-tests.yml').read_text(encoding='utf-8')
          assert text.count('          - shard: ') == 16
          assert 'assert len(paths) == 16, paths' in text
          assert "assert sorted(report['shard'] for report in reports) == list(range(16))" in text
          PY
          rm .github/workflows/otbm-atlas-final-shard-repair.yml
          git diff --check
      - name: Commit verified CI-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/otbm-atlas-tests.yml .github/workflows/otbm-atlas-final-shard-repair.yml
          git diff --cached --check
          git commit -m "ci(atlas): shard final gate by floor"
          git push origin HEAD:agent/oth-20260813-full-otbm-atlas-current-main
