---
name: OTBM Atlas V3 Repair
on:
  push:
    branches: [agent/oth-20260813-full-otbm-atlas-current-main]
    paths: [.github/workflows/otbm-atlas-v3-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/oth-20260813-full-otbm-atlas-current-main
          fetch-depth: 0
      - name: Apply exact v3 repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if text.count(old)!=1: raise SystemExit(f'{path}: expected one match, got {text.count(old)}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Appearance flags required by canonical stack/fluid pattern selection.
          replace('tools/otbm_atlas/assets.py', '\ttop: bool\n\tshift:', '\ttop: bool\n\tstackable: bool\n\tsplash: bool\n\tfluid_container: bool\n\tshift:')
          replace('tools/otbm_atlas/assets.py', '\t\ttop=4 in flags,\n\t\tshift=shift,', '\t\ttop=4 in flags,\n\t\tstackable=bool(_first_int(flags, 6)),\n\t\tsplash=bool(_first_int(flags, 12)),\n\t\tfluid_container=bool(_first_int(flags, 19)),\n\t\tshift=shift,')

          # Canonical item pattern selection and tile-stack visibility.
          p=Path('tools/otbm_atlas/render.py'); text=p.read_text(encoding='utf-8')
          text=text.replace('from .assets import Appearance, SpriteSheet,', 'from .assets import Appearance, SpriteInfo, SpriteSheet,',1)
          marker='\n\ndef _blend('
          helper='''\n\n_MODERN_FLUID_COLORS=(0,1,7,3,3,2,4,3,5,6,7,2,5,3,5,6,3,3,8,10,9)\n\ndef _item_patterns(appearance:Appearance,frame:SpriteInfo,item:Item,x:int,y:int,z:int)->tuple[int,int,int]:\n\tpx=x%frame.pattern_width;py=y%frame.pattern_height;pz=z%frame.pattern_depth\n\tif appearance.stackable and frame.pattern_width==4 and frame.pattern_height==2:\n\t\tcount=item.subtype or 0\n\t\tif count<=0:px,py=0,0\n\t\telif count<5:px,py=count-1,0\n\t\telif count<10:px,py=0,1\n\t\telif count<25:px,py=1,1\n\t\telif count<50:px,py=2,1\n\t\telse:px,py=3,1\n\t\tpz=0\n\telif appearance.splash or appearance.fluid_container:\n\t\tsubtype=item.subtype or 0;color=_MODERN_FLUID_COLORS[subtype] if 0<=subtype<len(_MODERN_FLUID_COLORS) else 0\n\t\tpx=(color%4)%frame.pattern_width;py=(color//4)%frame.pattern_height;pz=0\n\treturn px,py,pz\n'''
          if text.count(marker)!=1: raise SystemExit('render blend marker drifted')
          text=text.replace(marker,helper+marker,1)
          start=text.index('\tdef item_sprites(self, item: Item)')
          end=text.index('\n\ndef render_tiles',start)
          method='''\tdef item_sprites(self,item:Item,x:int,y:int,z:int)->Iterator[tuple[Appearance,int,tuple[int,int,bytes]]]:\n\t\tappearance=self.appearances.get(item.server_id);self.appearance_ids.add(item.server_id)\n\t\tif appearance is None or not appearance.frames:\n\t\t\tself.missing_appearances[item.server_id]+=1;return\n\t\tframe=appearance.frames[0];px,py,pz=_item_patterns(appearance,frame,item,x,y,z);phase=frame.default_start_phase%frame.animation_phases\n\t\tfor layer in range(frame.layers):\n\t\t\tindex=((((phase*frame.pattern_depth+pz)*frame.pattern_height+py)*frame.pattern_width+px)*frame.layers+layer)\n\t\t\tif index>=len(frame.sprite_ids):self.missing_sprites[-item.server_id]+=1;continue\n\t\t\tsprite_id=frame.sprite_ids[index];self.sprite_ids.add(sprite_id);decoded=self.sprite(sprite_id)\n\t\t\tif decoded is not None:yield appearance,sprite_id,decoded\n'''
          text=text[:start]+method+text[end:]
          old='''\t\tchildren = tuple(walk_items(tile.items))\n\t\tstats.child_items += len(children); items.extend(children)\n\t\tfor item in items:\n\t\t\tappearance_ids.add(item.server_id)\n\t\t\tfor appearance, _sprite_id, (sprite_width, sprite_height, pixels) in renderer.item_sprites(item):\n'''
          new='''\t\tstats.child_items += sum(1 for _item in walk_items(tile.items))\n\t\t# Item child nodes are container contents, not visible tile-stack entries.\n\t\titems.extend(tile.items)\n\t\tfor item in items:\n\t\t\tappearance_ids.add(item.server_id)\n\t\t\tfor appearance, _sprite_id, (sprite_width, sprite_height, pixels) in renderer.item_sprites(item,tile.position.x,tile.position.y,tile.position.z):\n'''
          if text.count(old)!=1: raise SystemExit('render tile block drifted')
          text=text.replace(old,new,1)
          text=text.replace('\t\t"animationPolicy": "first frame group, declared default_start_phase, no elapsed-time advancement",\n', '\t\t"animationPolicy": "first frame group, declared default_start_phase, no elapsed-time advancement",\n\t\t"itemPatternPolicy": "OTClient-compatible position, stack-count and modern-fluid subtype patterns",\n',1)
          p.write_text(text,encoding='utf-8')

          # Remove broad numeric-table UID guessing; dynamic/indexed cases stay unknown.
          p=Path('tools/otbm_atlas/mechanics.py');text=p.read_text(encoding='utf-8')
          text=text.replace('TABLE_KEY = re.compile(r"\\[\\s*(\\d+)\\s*\\]\\s*=")\nUID_DISPATCH = re.compile(r"\\[[^\\]\\n]*(?:\\.uid|getUniqueId\\s*\\()[^\\]\\n]*\\]")\n','',1)
          block='''\t\t# Some legacy Action scripts register a shared AID, then dispatch on item.uid.\n\t\tif UID_DISPATCH.search(text):\n\t\t\tfor value in map(int, TABLE_KEY.findall(text)):\n\t\t\t\tregistrations["uid"][value].append({"script": relative, "basis": "literal-uid-dispatch-key"})\n'''
          if text.count(block)!=1: raise SystemExit('mechanics heuristic block drifted')
          p.write_text(text.replace(block,'',1),encoding='utf-8')

          # Separate base-map and supplemental spawn layers at shard/search level.
          Path('tools/otbm_atlas/spatial.py').write_text('''"""Build bounded viewport overlay shards and a compact factual search index."""\nfrom __future__ import annotations\nfrom collections import defaultdict\nimport json\nfrom pathlib import Path\nPOSITION_KEYS={"towns":"temple","houses":"entry"}\nSUPPLEMENTAL={"monsterSpawns":"supplementalMonsterSpawns","npcSpawns":"supplementalNpcSpawns"}\ndef _position(kind:str,record:dict)->dict|None:return record.get(POSITION_KEYS.get(kind,"position"))\ndef _viewer_kind(kind:str,record:dict)->str:\n\treturn SUPPLEMENTAL[kind] if kind in SUPPLEMENTAL and record.get("origin")!="base-map" else kind\ndef write_spatial_data(output:Path,chunk_size:int,groups:dict[str,list[dict]])->dict[str,int]:\n\tshards=defaultdict(lambda:defaultdict(list));search=[];seen=set()\n\tfor kind,records in groups.items():\n\t\tfor record in records:\n\t\t\tposition=_position(kind,record)\n\t\t\tif not position:continue\n\t\t\tviewer_kind=_viewer_kind(kind,record);key=(int(position["z"]),int(position["x"])//chunk_size,int(position["y"])//chunk_size)\n\t\t\tvalue={**record,"kind":viewer_kind};shards[key][viewer_kind].append(value)\n\t\t\tlabel=record.get("name") or record.get("actionId") or record.get("uniqueId") or record.get("houseId")\n\t\t\tif label is not None:\n\t\t\t\tskey=(viewer_kind,str(label).casefold())\n\t\t\t\tif skey not in seen:seen.add(skey);search.append({"kind":viewer_kind,"label":str(label),"position":position})\n\troot=output/"data"/"chunks"\n\tfor (z,x,y),content in shards.items():\n\t\tpath=root/f"z{z}"/f"{x}_{y}.json";path.parent.mkdir(parents=True,exist_ok=True);path.write_text(json.dumps({"schemaVersion":1,**content},separators=(",",":"),sort_keys=True)+"\\n",encoding="utf-8")\n\t(output/"data"/"search-index.json").write_text(json.dumps({"schemaVersion":1,"records":sorted(search,key=lambda v:(v["label"].casefold(),v["kind"]))},separators=(",",":"),sort_keys=True)+"\\n",encoding="utf-8")\n\treturn {"shards":len(shards),"searchRecords":len(search)}\n''',encoding='utf-8')

          # Preserve merged NPC sprite UI while adding supplemental controls and hardened detailed rendering.
          replace('tools/otbm_atlas/viewer.py','<label><input type="checkbox" data-overlay="npcSpawns">NPCs</label><label><input type="checkbox" data-overlay="monsterSpawns">Monsters</label>','<label><input type="checkbox" data-overlay="npcSpawns">NPCs (base map)</label><label><input type="checkbox" data-overlay="monsterSpawns">Monsters (base map)</label><label><input type="checkbox" data-overlay="supplementalNpcSpawns">Supplemental NPCs</label><label><input type="checkbox" data-overlay="supplementalMonsterSpawns">Supplemental monsters</label>')
          p=Path('tools/otbm_atlas/viewer_app.js');text=p.read_text(encoding='utf-8')
          old="function markerAt(clientX,clientY){const x=clientX*devicePixelRatio,y=clientY*devicePixelRatio;for(const entry of overlayCache.map.values())for(const [kind,records] of Object.entries(entry.value))if(Array.isArray(records))for(const record of records)if(record._hit&&Math.hypot(x-record._hit[0],y-record._hit[1])<=record._hit[2])return {kind,record};return null}"
          new="function markerAt(clientX,clientY){const x=clientX*devicePixelRatio,y=clientY*devicePixelRatio;for(const chunk of visible){const key=`${chunk.z}/${chunk.chunkX}_${chunk.chunkY}`,entry=overlayCache.get(key);if(!entry)continue;for(const kind of state.overlays){if(state.zoom<.25&&(kind==='monsterSpawns'||kind==='supplementalMonsterSpawns'))continue;for(const record of entry[kind]||[])if(record._hit&&Math.hypot(x-record._hit[0],y-record._hit[1])<=record._hit[2])return {kind,record}}}return null}"
          if text.count(old)!=1:raise SystemExit('markerAt drifted')
          text=text.replace(old,new,1)
          text=text.replace("if(state.zoom<.25&&kind==='monsterSpawns')continue;","if(state.zoom<.25&&(kind==='monsterSpawns'||kind==='supplementalMonsterSpawns'))continue;",1)
          text=text.replace("const hasNpcSprite=kind==='npcSpawns'&&record.sprite;","const hasNpcSprite=(kind==='npcSpawns'||kind==='supplementalNpcSpawns')&&record.sprite;",1)
          text=text.replace("ctx.fillStyle=kind==='teleports'?'#00d8ff':kind==='monsterSpawns'?'#f04f4f':kind==='npcSpawns'?'#55df78':'#ffd24a';","ctx.fillStyle=kind==='teleports'?'#00d8ff':kind==='monsterSpawns'?'#f04f4f':kind==='supplementalMonsterSpawns'?'#b66b6b':kind==='npcSpawns'?'#55df78':kind==='supplementalNpcSpawns'?'#7bb98b':'#ffd24a';",1)
          text=text.replace('ctx.clearRect(0,0,canvas.width,canvas.height);const layer=baseLayer','ctx.clearRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;const layer=baseLayer',1)
          p.write_text(text,encoding='utf-8')

          replace('tools/otbm_atlas/atlas.py','ATLAS_VERSION = 2','ATLAS_VERSION = 3')

          Path('tools/otbm_atlas/tests/test_v3_semantics.py').write_text('''from __future__ import annotations\nfrom collections import Counter\nimport json,tempfile,unittest\nfrom pathlib import Path\nfrom tools.otbm_atlas.assets import Appearance,SpriteInfo\nfrom tools.otbm_atlas import atlas\nfrom tools.otbm_atlas.mechanics import resolve_mechanics\nfrom tools.otbm_atlas.render import _item_patterns,render_tiles\nfrom tools.otbm_atlas.semantic import Item,Position,Tile\nfrom tools.otbm_atlas.spatial import write_spatial_data\n\ndef app(**kw):\n\tbase=dict(appearance_id=1,name="x",is_ground=False,clip=False,bottom=False,top=False,stackable=False,splash=False,fluid_container=False,shift=None,height=None,frames=())\n\tbase.update(kw);return Appearance(**base)\nclass FakeRenderer:\n\tdef __init__(self):self.missing_appearances=Counter();self.missing_sprites=Counter();self.calls=[]\n\tdef item_sprites(self,item,x,y,z):self.calls.append(item.server_id);return iter(())\nclass V3Tests(unittest.TestCase):\n\tdef test_authoritative_version(self):self.assertEqual(atlas.ATLAS_VERSION,3)\n\tdef test_stack_and_fluid_patterns(self):\n\t\tstack=SpriteInfo(4,2,1,1,tuple(range(8)),1,0);fluid=SpriteInfo(4,3,1,1,tuple(range(12)),1,0)\n\t\tself.assertEqual(_item_patterns(app(stackable=True),stack,Item(1,25),10,11,7),(2,1,0))\n\t\tself.assertEqual(_item_patterns(app(fluid_container=True),fluid,Item(1,2),0,0,7),(3,1,0))\n\tdef test_nested_container_children_are_not_visible_stack(self):\n\t\tr=FakeRenderer();tile=Tile(Position(1,2,7),None,0,None,(Item(100,children=(Item(200),)),))\n\t\t_,report=render_tiles(iter((tile,)),r,(1,1,2,2,7));self.assertEqual(r.calls,[100]);self.assertEqual(report["childItems"],2)\n\tdef test_dynamic_uid_tables_do_not_guess(self):\n\t\twith tempfile.TemporaryDirectory() as d:\n\t\t\troot=Path(d);(root/"x.lua").write_text("local config={ [2246]={}, [1]={} }\\nlocal x=config[item.uid]\\n",encoding="utf-8")\n\t\t\treport=resolve_mechanics({"uniqueIds":[{"uniqueId":2246}],"actionIds":[]},root);self.assertEqual(report["resolutions"][0]["status"],"UNRESOLVED")\n\tdef test_supplemental_spawns_are_separate_shards(self):\n\t\twith tempfile.TemporaryDirectory() as d:\n\t\t\troot=Path(d);write_spatial_data(root,128,{"npcSpawns":[{"name":"Base","position":{"x":256,"y":384,"z":7},"origin":"base-map"},{"name":"Event","position":{"x":257,"y":384,"z":7},"origin":"annual-event-map"}]})\n\t\t\tchunk=json.loads((root/"data/chunks/z7/2_3.json").read_text());self.assertEqual(chunk["npcSpawns"][0]["name"],"Base");self.assertEqual(chunk["supplementalNpcSpawns"][0]["name"],"Event")\n\tdef test_viewer_detail_and_hit_contract(self):\n\t\ttext=(Path(__file__).parents[1]/"viewer_app.js").read_text();self.assertIn("ctx.imageSmoothingEnabled=false",text);self.assertIn("for(const chunk of visible)",text);self.assertIn("supplementalMonsterSpawns",text)\nif __name__=="__main__":unittest.main()\n''',encoding='utf-8')
          PY
      - name: Validate current-main repair
        run: |
          git diff --check
          node --check tools/otbm_atlas/viewer_app.js
          python3 -m unittest discover -s tools/otbm_atlas/tests -p 'test_*.py' -v
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/otbm-atlas-v3-repair.yml
          git add tools/otbm_atlas
          git commit -m "fix(atlas): correct canonical v3 detail semantics"
          git push origin HEAD:agent/oth-20260813-full-otbm-atlas-current-main
