---
name: OTBM Atlas Hit Test Repair
on:
  push:
    branches: [agent/oth-20260813-full-otbm-atlas-current-main]
    paths: [.github/workflows/otbm-atlas-hit-test-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Restrict hit testing to enabled layers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/otbm_atlas/viewer_app.js'); text=p.read_text(encoding='utf-8')
          old="for(const [kind,records] of Object.entries(entry.value))if(Array.isArray(records))for(const record of records)if(record._hit&&Math.hypot(x-record._hit[0],y-record._hit[1])<=record._hit[2])return {kind,record}"
          new="for(const kind of state.overlays){const records=entry.value[kind];if(!Array.isArray(records))continue;for(const record of records)if(record._hit&&Math.hypot(x-record._hit[0],y-record._hit[1])<=record._hit[2])return {kind,record}}"
          if text.count(old)!=1: raise SystemExit(f'markerAt drifted: {text.count(old)} matches')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          p=Path('tools/otbm_atlas/tests/test_viewer.py'); text=p.read_text(encoding='utf-8')
          needle='self.assertIn("if(target)showDetails(item.kind,target)",app)'
          replacement=needle+';self.assertIn("for(const kind of state.overlays){const records=entry.value[kind]",app)'
          if text.count(needle)!=1: raise SystemExit('viewer test drifted')
          p.write_text(text.replace(needle,replacement,1),encoding='utf-8')
          PY
          git diff --check
          node --check tools/otbm_atlas/viewer_app.js
          python3 -m unittest discover -s tools/otbm_atlas/tests -p 'test_*.py' -v
      - name: Commit validated repair only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/otbm-atlas-hit-test-fix.yml
          git add tools/otbm_atlas/viewer_app.js tools/otbm_atlas/tests/test_viewer.py
          git commit -m "fix(atlas): ignore disabled-layer marker hits"
          git push origin HEAD:agent/oth-20260813-full-otbm-atlas-current-main
