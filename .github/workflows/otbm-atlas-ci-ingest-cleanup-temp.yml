---
name: OTBM Atlas CI Ingest Temporary Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/otbm-atlas-ci-ingest-cleanup-temp.yml"

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove stale pre-production ingest test endpoints
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ots, synology]
    timeout-minutes: 10
    steps:
      - name: Remove only Atlas CI ingest test/runtime endpoints created before production activation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_NAME:-}" == "synology-ots-01" ]]
          mapfile -t containers < <(docker ps -a --format '{{.Names}}' | grep -E '^atlas-ci-(receiver|tunnel)-[0-9]+-[0-9]+$' || true)
          if ((${#containers[@]})); then
            printf 'Removing stale containers:\n%s\n' "${containers[*]}"
            docker rm -f "${containers[@]}"
          fi
          mapfile -t networks < <(docker network ls --format '{{.Name}}' | grep -E '^atlas-ci-net-[0-9]+-[0-9]+$' || true)
          if ((${#networks[@]})); then
            printf 'Removing stale networks:\n%s\n' "${networks[*]}"
            docker network rm "${networks[@]}" || true
          fi
          docker run --rm -v /volume1/docker/otheryn/atlas:/atlas alpine:3.22 sh -lc \
            'rm -rf /atlas/ci-ingest-tests/ci-test-*'
          echo 'STALE_PREPRODUCTION_INGEST_CLEANUP=PASS'
