---
name: PRS-004C Durable Fence CAS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - schema.sql
      - data-otservbr-global/migrations/60.lua
      - src/database/player_writer_fence_repository.*
      - tests/integration/database/CMakeLists.txt
      - tests/integration/database/player_writer_fence_repository_it.cpp
      - .github/workflows/prs-004c-durable-fence-cas.yml
      - docs/architecture/prs-004c-durable-writer-fence-cas.md
      - docs/agents/tasks/active/OTH-20260731-prs004c-durable-fence-cas.md
  push:
    branches:
      - main
    paths:
      - schema.sql
      - data-otservbr-global/migrations/60.lua
      - src/database/player_writer_fence_repository.*
      - tests/integration/database/**
      - .github/workflows/prs-004c-durable-fence-cas.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      buildtypes: '["linux-debug"]'
      run_canary_smoke: false
      run_global_smoke: false
    secrets: inherit
