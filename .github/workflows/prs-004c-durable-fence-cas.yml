---
name: PRS-004C Durable Fence CAS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - schema.sql
      - data-otservbr-global/migrations/60.lua
      - src/database/player_writer_fence_repository.*
      - tests/integration/database/CMakeLists.txt
      - tests/integration/database/player_writer_fence_repository_it.cpp
      - .github/workflows/prs-004c-durable-fence-cas.yml
      - docs/architecture/prs-004c-durable-writer-fence-cas.md
      - docs/agents/tasks/active/OTH-20260731-prs004c-durable-fence-cas.md

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-schema-60:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Materialize released-state-compatible schema
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('schema.sql')
          text = path.read_text(encoding='utf-8')
          if "('db_version', '60')" in text:
              raise SystemExit(0)
          if text.count("('db_version', '59')") != 1:
              raise SystemExit('expected exactly one schema version 59 marker')
          text = text.replace("('db_version', '59')", "('db_version', '60')", 1)

          old = """CONSTRAINT `player_writer_fence_active_ck` CHECK (
        (`ownership_generation` = 0 AND `writer_token` IS NULL)
        OR (`ownership_generation` > 0 AND `writer_token` IS NOT NULL)
    ),"""
          new = """CONSTRAINT `player_writer_fence_active_ck` CHECK (
        (`ownership_generation` = 0 AND `writer_token` IS NULL AND `state_revision` = 0)
        OR (`ownership_generation` > 0)
    ),"""
          if text.count(old) != 1:
              raise SystemExit('expected exactly one PRS-004B check constraint')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit canonical schema when required
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if git diff --quiet -- schema.sql; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$HEAD_REPO" != "${{ github.repository }}" ]]; then
            echo "schema materialization requires a same-repository branch" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add schema.sql
          git commit -m "build(database): materialize released fence schema"
          git push origin "HEAD:${HEAD_REF}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  integration:
    needs: materialize-schema-60
    if: needs.materialize-schema-60.outputs.changed == 'false'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      buildtypes: '["linux-debug"]'
      run_canary_smoke: false
      run_global_smoke: false
    secrets: inherit
