---
name: OTBM Atlas V3 Core Repair
on:
  push:
    branches: [agent/oth-20260813-full-otbm-atlas-current-main]
    paths: [.github/workflows/otbm-atlas-v3-core-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/oth-20260813-full-otbm-atlas-current-main
          fetch-depth: 0
      - name: Apply exact core repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace('tools/otbm_atlas/assets.py','\ttop: bool\n\tshift:','\ttop: bool\n\tstackable: bool\n\tsplash: bool\n\tfluid_container: bool\n\tshift:')
          replace('tools/otbm_atlas/assets.py','\t\ttop=4 in flags,\n\t\tshift=shift,','\t\ttop=4 in flags,\n\t\tstackable=bool(_first_int(flags, 6)),\n\t\tsplash=bool(_first_int(flags, 12)),\n\t\tfluid_container=bool(_first_int(flags, 19)),\n\t\tshift=shift,')

          p=Path('tools/otbm_atlas/render.py'); text=p.read_text(encoding='utf-8')
          if text.count('from .assets import Appearance, SpriteSheet,')!=1: raise SystemExit('render import drifted')
          text=text.replace('from .assets import Appearance, SpriteSheet,','from .assets import Appearance, SpriteInfo, SpriteSheet,',1)
          marker='\n\ndef _blend('
          helper='''\n\n_MODERN_FLUID_COLORS=(0,1,7,3,3,2,4,3,5,6,7,2,5,3,5,6,3,3,8,10,9)\n\ndef _item_patterns(appearance:Appearance,frame:SpriteInfo,item:Item,x:int,y:int,z:int)->tuple[int,int,int]:\n\tpx=x%frame.pattern_width;py=y%frame.pattern_height;pz=z%frame.pattern_depth\n\tif appearance.stackable and frame.pattern_width==4 and frame.pattern_height==2:\n\t\tcount=item.subtype or 0\n\t\tif count<=0:px,py=0,0\n\t\telif count<5:px,py=count-1,0\n\t\telif count<10:px,py=0,1\n\t\telif count<25:px,py=1,1\n\t\telif count<50:px,py=2,1\n\t\telse:px,py=3,1\n\t\tpz=0\n\telif appearance.splash or appearance.fluid_container:\n\t\tsubtype=item.subtype or 0;color=_MODERN_FLUID_COLORS[subtype] if 0<=subtype<len(_MODERN_FLUID_COLORS) else 0\n\t\tpx=(color%4)%frame.pattern_width;py=(color//4)%frame.pattern_height;pz=0\n\treturn px,py,pz\n'''
          if text.count(marker)!=1: raise SystemExit('render blend marker drifted')
          text=text.replace(marker,helper+marker,1)
          start_marker='\tdef item_sprites(self, item: Item, position_x: int, position_y: int, position_z: int) -> Iterator[tuple[Appearance, int, tuple[int, int, bytes]]]:\n'
          if text.count(start_marker)!=1: raise SystemExit('item_sprites signature drifted')
          start=text.index(start_marker); end=text.index('\n\ndef render_tiles',start)
          method='''\tdef item_sprites(self,item:Item,position_x:int,position_y:int,position_z:int)->Iterator[tuple[Appearance,int,tuple[int,int,bytes]]]:\n\t\tappearance=self.appearances.get(item.server_id);self.appearance_ids.add(item.server_id)\n\t\tif appearance is None or not appearance.frames:\n\t\t\tself.missing_appearances[item.server_id]+=1;return\n\t\tframe=appearance.frames[0];px,py,pz=_item_patterns(appearance,frame,item,position_x,position_y,position_z);phase=frame.default_start_phase%frame.animation_phases\n\t\tfor layer in range(frame.layers):\n\t\t\tindex=((((phase*frame.pattern_depth+pz)*frame.pattern_height+py)*frame.pattern_width+px)*frame.layers+layer)\n\t\t\tif index>=len(frame.sprite_ids):self.missing_sprites[-item.server_id]+=1;continue\n\t\t\tsprite_id=frame.sprite_ids[index];self.sprite_ids.add(sprite_id);decoded=self.sprite(sprite_id)\n\t\t\tif decoded is not None:yield appearance,sprite_id,decoded\n'''
          text=text[:start]+method+text[end:]
          old='''\t\tchildren = tuple(walk_items(tile.items)); stats.child_items += len(children); items.extend(children)\n\t\tfor item in items:\n\t\t\tappearance_ids.add(item.server_id)\n\t\t\tfor appearance, _sprite_id, (sprite_width, sprite_height, pixels) in renderer.item_sprites(item, tile.position.x, tile.position.y, tile.position.z):\n'''
          new='''\t\tstats.child_items += sum(1 for _item in walk_items(tile.items))\n\t\t# Item child nodes below top-level tile items are container contents, not visible map stack entries.\n\t\titems.extend(tile.items)\n\t\tfor item in items:\n\t\t\tappearance_ids.add(item.server_id)\n\t\t\tfor appearance, _sprite_id, (sprite_width, sprite_height, pixels) in renderer.item_sprites(item, tile.position.x, tile.position.y, tile.position.z):\n'''
          if text.count(old)!=1: raise SystemExit('render tile block drifted')
          text=text.replace(old,new,1)
          report='\t\t"animationPolicy": "first frame group, declared default_start_phase, no elapsed-time advancement",\n'
          if text.count(report)!=1: raise SystemExit('render report marker drifted')
          text=text.replace(report,report+'\t\t"itemPatternPolicy": "OTClient-compatible position, stack-count and modern-fluid subtype patterns",\n',1)
          p.write_text(text,encoding='utf-8')

          p=Path('tools/otbm_atlas/mechanics.py'); text=p.read_text(encoding='utf-8')
          exact='TABLE_KEY = re.compile(r"\\[\\s*(\\d+)\\s*\\]\\s*=")\nUID_DISPATCH = re.compile(r"\\[[^\\]\\n]*(?:\\.uid|getUniqueId\\s*\\()[^\\]\\n]*\\]")\n'
          if text.count(exact)!=1: raise SystemExit('mechanics regex block drifted')
          text=text.replace(exact,'',1)
          block='''\t\t# Some legacy Action scripts register a shared AID, then dispatch on item.uid.\n\t\tif UID_DISPATCH.search(text):\n\t\t\tfor value in map(int, TABLE_KEY.findall(text)):\n\t\t\t\tregistrations["uid"][value].append({"script": relative, "basis": "literal-uid-dispatch-key"})\n'''
          if text.count(block)!=1: raise SystemExit('mechanics heuristic block drifted')
          p.write_text(text.replace(block,'',1),encoding='utf-8')

          replace('tools/otbm_atlas/atlas.py','ATLAS_VERSION = 2','ATLAS_VERSION = 3')

          Path('tools/otbm_atlas/tests/test_v3_core.py').write_text('''from __future__ import annotations\nfrom collections import Counter\nimport tempfile,unittest\nfrom pathlib import Path\nfrom tools.otbm_atlas.assets import Appearance,SpriteInfo\nfrom tools.otbm_atlas import atlas\nfrom tools.otbm_atlas.mechanics import resolve_mechanics\nfrom tools.otbm_atlas.render import _item_patterns,render_tiles\nfrom tools.otbm_atlas.semantic import Item,Position,Tile\n\ndef app(**kw):\n\tbase=dict(appearance_id=1,name="x",is_ground=False,clip=False,bottom=False,top=False,stackable=False,splash=False,fluid_container=False,shift=None,height=None,frames=())\n\tbase.update(kw);return Appearance(**base)\nclass FakeRenderer:\n\tdef __init__(self):self.missing_appearances=Counter();self.missing_sprites=Counter();self.calls=[]\n\tdef item_sprites(self,item,x,y,z):self.calls.append(item.server_id);return iter(())\nclass V3CoreTests(unittest.TestCase):\n\tdef test_authoritative_version(self):self.assertEqual(atlas.ATLAS_VERSION,3)\n\tdef test_stack_and_fluid_patterns(self):\n\t\tstack=SpriteInfo(4,2,1,1,tuple(range(8)),1,0);fluid=SpriteInfo(4,3,1,1,tuple(range(12)),1,0)\n\t\tself.assertEqual(_item_patterns(app(stackable=True),stack,Item(1,25),10,11,7),(2,1,0))\n\t\tself.assertEqual(_item_patterns(app(fluid_container=True),fluid,Item(1,2),0,0,7),(3,1,0))\n\tdef test_nested_container_children_are_not_visible_stack(self):\n\t\tr=FakeRenderer();tile=Tile(Position(1,2,7),None,0,None,(Item(100,children=(Item(200),)),))\n\t\t_,report=render_tiles(iter((tile,)),r,(1,1,2,2,7));self.assertEqual(r.calls,[100]);self.assertEqual(report["childItems"],2)\n\tdef test_dynamic_uid_tables_do_not_guess(self):\n\t\twith tempfile.TemporaryDirectory() as d:\n\t\t\troot=Path(d);(root/"x.lua").write_text("local config={ [2246]={}, [1]={} }\\nlocal x=config[item.uid]\\n",encoding="utf-8")\n\t\t\treport=resolve_mechanics({"uniqueIds":[{"uniqueId":2246}],"actionIds":[]},root);self.assertEqual(report["resolutions"][0]["status"],"UNRESOLVED")\nif __name__=="__main__":unittest.main()\n''',encoding='utf-8')
          PY
      - name: Validate core repair
        run: |
          git diff --check
          python3 -m unittest discover -s tools/otbm_atlas/tests -p 'test_*.py' -v
      - name: Commit validated core repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/otbm-atlas-v3-core-repair.yml .github/workflows/otbm-atlas-v3-repair.yml
          git add tools/otbm_atlas
          git commit -m "fix(atlas): correct canonical v3 render semantics"
          git push origin HEAD:agent/oth-20260813-full-otbm-atlas-current-main
