---
name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "data-canary/**"
      - "data-otservbr-global/**"
      - "cmake/**"
      - "docker/**"
      - "docs/lua-api/**"
      - "docs/systems/**"
      - "tools/**"
      - "vcproj/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "data-canary/**"
      - "data-otservbr-global/**"
      - "cmake/**"
      - "docker/**"
      - "docs/lua-api/**"
      - "docs/systems/**"
      - "tools/**"
      - "vcproj/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-prs-004d-final-save:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 339 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dudantas/prs-004d-protected-player-save' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: blakinio/Otheryn
          ref: dudantas/prs-004d-protected-player-save
          fetch-depth: 0

      - name: Apply bounded PRS-004D final-save repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/game/scheduling/save_manager.cpp')
          text = path.read_text(encoding='utf-8')
          old_attempt = '''\t\tconst auto attempt = executePlayerCheckpointAttempt(*state, *generation, [this, &player] {
\t\t\treturn doSavePlayer(player, true);
\t\t});'''
          new_attempt = '''\t\tconst auto attempt = executePlayerCheckpointAttempt(*state, *generation, [this, &player] {
\t\t\treturn doSavePlayer(player, false);
\t\t});'''
          old_success = '''\t\tif (!attempt.followUpRequired && !state->isDirty()) {
\t\t\treturn true;
\t\t}'''
          new_success = '''\t\tif (!attempt.followUpRequired && !state->isDirty()) {
\t\t\tif (!releasePlayerWriterFence(player)) {
\t\t\t\tlogger.error("Final save for player {} committed but durable writer-fence release failed.", player->getName());
\t\t\t\treturn false;
\t\t\t}
\t\t\treturn true;
\t\t}'''

          if new_attempt in text and new_success in text:
              Path('/tmp/already-applied').write_text('yes', encoding='utf-8')
          else:
              if text.count(old_attempt) != 1 or text.count(old_success) != 1:
                  raise SystemExit('final-save repair markers are neither pristine nor fully repaired')
              path.write_text(text.replace(old_attempt, new_attempt, 1).replace(old_success, new_success, 1), encoding='utf-8')
          PY

      - name: Commit exactly one repaired file
        run: |
          if [[ -f /tmp/already-applied ]]; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/scheduling/save_manager.cpp
          git diff --cached --check
          [[ "$(git diff --cached --name-only)" == "src/game/scheduling/save_manager.cpp" ]]
          git commit -m "fix(resilience): release writer fence after final checkpoint"
          git push origin HEAD:dudantas/prs-004d-protected-player-save

  changes:
    name: Detect Build Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      linux: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.filter.outputs.engine == 'true' || steps.filter.outputs.shared_datapack == 'true' || steps.filter.outputs.canary_datapack == 'true' || steps.filter.outputs.global_datapack == 'true' }}
      full_matrix: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.filter.outputs.engine == 'true' }}
      run_canary_smoke: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.filter.outputs.engine == 'true' || steps.filter.outputs.shared_datapack == 'true' || steps.filter.outputs.canary_datapack == 'true' }}
      run_global_smoke: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.filter.outputs.engine == 'true' || steps.filter.outputs.shared_datapack == 'true' || steps.filter.outputs.global_datapack == 'true' }}
      docker: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.docker }}
      docker_quickstart: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.docker_quickstart }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            engine:
              - "src/**"
              - "tests/**"
              - "cmake/**"
              - "vcproj/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-linux.yml"
              - ".github/workflows/reusable-build-windows.yml"
              - ".github/workflows/reusable-build-macos.yml"
              - ".github/scripts/**"
            shared_datapack:
              - "data/**"
            canary_datapack:
              - "data-canary/**"
            global_datapack:
              - "data-otservbr-global/**"
            docker:
              - "docker/**"
              - "src/**"
              - "cmake/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-docker.yml"
              - ".github/scripts/**"
            docker_quickstart:
              - "docker/docker-compose.yml"
              - "docker/.env.dist"
              - "docker/quickstart/**"
              - "docker/data/01-test_account.sql"
              - "docker/data/02-test_account_players.sql"
              - ".github/scripts/docker-quickstart-smoke.sh"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-docker-quickstart-smoke.yml"

  # --- Fast Checks ---

  checks:
    name: Fast Checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: write
      checks: write
    uses: ./.github/workflows/reusable-checks.yml
    secrets: inherit

  tests-lua:
    name: Lua Tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests-lua.yml
    secrets: inherit

  # --- Heavy Builds ---

  build-linux:
    name: Build - Linux
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.linux == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      buildtypes: ${{ needs.changes.outputs.full_matrix == 'true' && '["linux-release","linux-debug"]' || '["linux-release"]' }}
      run_canary_smoke: ${{ needs.changes.outputs.run_canary_smoke == 'true' }}
      run_global_smoke: ${{ needs.changes.outputs.run_global_smoke == 'true' }}
    secrets: inherit

  build-windows:
    name: Build - Windows
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.full_matrix == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-windows.yml
    with:
      run_canary_smoke: ${{ needs.changes.outputs.run_canary_smoke == 'true' }}
    secrets: inherit

  build-macos:
    name: Build - macOS
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.full_matrix == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-macos.yml
    with:
      run_canary_smoke: ${{ needs.changes.outputs.run_canary_smoke == 'true' }}
    secrets: inherit

  build-docker:
    name: Build - Docker
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.docker == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-docker.yml
    secrets: inherit

  docker-quickstart-smoke:
    name: Docker Quickstart Smoke
    needs: [changes, checks, tests-lua, build-docker]
    if: (needs.changes.outputs.docker == 'true' || needs.changes.outputs.docker_quickstart == 'true') && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && needs.build-docker.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-docker-quickstart-smoke.yml
