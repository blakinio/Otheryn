---
name: OTBM Atlas Release Dispatch Once

on:
  push:
    branches:
      - docs/OTH-20260814-atlas-release-validation-checkpoint

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted full-world workflow on exact main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 1021d08978f078ff845e6f3f82fbbbc482cbf543
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          actual_main_sha="$(
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API_URL}/repos/${REPOSITORY}/git/ref/heads/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])'
          )"
          test "${actual_main_sha}" = "${EXPECTED_MAIN_SHA}"
          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API_URL}/repos/${REPOSITORY}/actions/workflows/otbm-atlas-full-world-release.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched canonical full-world release validation for ${actual_main_sha}."
