name: External Truth Source Evidence

on:
  push:
    branches:
      - audit/otheryn-external-truth-source-enrichment-20260804
    paths:
      - docs/agents/evidence/OTERYN-20260804-external-truth-source-enrichment/**
      - .github/workflows/external-truth-source-evidence.yml
  pull_request:
    paths:
      - docs/agents/evidence/OTERYN-20260804-external-truth-source-enrichment/**
      - docs/agents/tasks/active/OTERYN-20260804-external-truth-source-enrichment.md
      - .github/workflows/external-truth-source-evidence.yml

permissions:
  contents: read

concurrency:
  group: external-truth-source-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate canonical evidence
        run: python docs/agents/evidence/OTERYN-20260804-external-truth-source-enrichment/validate_evidence.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: external-truth-source-validation
          path: |
            validation.txt
            validation.json
          if-no-files-found: error
