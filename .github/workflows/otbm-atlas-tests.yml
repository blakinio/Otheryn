---
name: OTBM Atlas Tests

on:
  pull_request:
    paths:
      - "tools/otbm_atlas/**"
      - ".github/workflows/otbm-atlas-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Atlas unit and runtime tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Run atlas tests
        run: python3 -m unittest discover -s tools/otbm_atlas/tests -p 'test_*.py' -v
