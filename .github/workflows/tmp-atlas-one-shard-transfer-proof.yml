name: Temporary Atlas One-Shard Transfer Proof

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: atlas-one-shard-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admission:
    name: Admit exact bounded proof
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Require exact internal proof branch
        id: check
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REF" = "fix/OTH-20260817-atlas-durable-shard-transfer"
          test "$HEAD_SHA" != ""
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "proof_head=$HEAD_SHA"

  receiver:
    name: Prepare fresh Synology proof generation
    needs: admission
    runs-on: [ots, synology]
    timeout-minutes: 15
    outputs:
      url: ${{ steps.prepare.outputs.url }}
      generation: ${{ steps.prepare.outputs.generation }}
      receiver: ${{ steps.prepare.outputs.receiver }}
      tunnel: ${{ steps.prepare.outputs.tunnel }}
      network: ${{ steps.prepare.outputs.network }}
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ needs.admission.outputs.head_sha }}
          persist-credentials: false
      - name: Start isolated OIDC receiver and tunnel
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME:-}" = "synology-ots-01"
          docker version >/dev/null
          generation="one-shard-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          receiver="atlas-one-shard-proof-receiver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tunnel="atlas-one-shard-proof-tunnel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="atlas-one-shard-proof-net-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          host_root="/volume1/docker/otheryn/atlas/ci-ingest-tests/${generation}"
          audience="ots-atlas-ci-ingest:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

          available_kb="$(docker run --rm -v /volume1/docker/otheryn/atlas:/atlas alpine:3.22 df -Pk /atlas | awk 'NR==2 {print $4}')"
          minimum_kb=$((2 * 1024 * 1024))
          test "$available_kb" -ge "$minimum_kb"

          docker rm -f "$receiver" "$tunnel" >/dev/null 2>&1 || true
          docker network rm "$network" >/dev/null 2>&1 || true
          docker run --rm -v /volume1/docker/otheryn/atlas:/atlas alpine:3.22 \
            sh -lc "test ! -e '/atlas/ci-ingest-tests/${generation}'; mkdir -p '/atlas/ci-ingest-tests/${generation}/control/repo'"
          tar -cf - tools/otbm_atlas deploy/otbm-atlas-ci-ingest | \
            docker run --rm -i -v /volume1/docker/otheryn/atlas:/atlas alpine:3.22 \
              sh -lc "tar -xf - -C '/atlas/ci-ingest-tests/${generation}/control/repo'"

          docker network create "$network" >/dev/null
          docker run -d --name "$receiver" --network "$network" \
            -v "${host_root}:/data" python:3.12-slim \
            python /data/control/repo/deploy/otbm-atlas-ci-ingest/receiver.py \
              --root /data \
              --github-oidc-repository "$GITHUB_REPOSITORY" \
              --github-oidc-run-id "$GITHUB_RUN_ID" \
              --github-oidc-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --github-oidc-audience "$audience" \
              --github-oidc-event-name "$GITHUB_EVENT_NAME" \
              --github-oidc-runner-environment github-hosted \
              --port 8080 >/dev/null
          docker run -d --name "$tunnel" --network "$network" \
            cloudflare/cloudflared:2026.7.3 tunnel --no-autoupdate --url "http://${receiver}:8080" >/dev/null

          url=""
          for _ in $(seq 1 60); do
            url="$(docker logs "$tunnel" 2>&1 | grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' | tail -n1 || true)"
            test -n "$url" && break
            sleep 2
          done
          test -n "$url"
          for _ in $(seq 1 30); do
            if docker exec "$receiver" python -c 'import json; from urllib.request import urlopen; assert json.load(urlopen("http://127.0.0.1:8080/health", timeout=5))["status"]=="READY"'; then
              break
            fi
            sleep 2
          done
          docker exec "$receiver" python -c 'import json; from urllib.request import urlopen; assert json.load(urlopen("http://127.0.0.1:8080/health", timeout=5))["status"]=="READY"'

          {
            echo "url=$url"
            echo "generation=$generation"
            echo "receiver=$receiver"
            echo "tunnel=$tunnel"
            echo "network=$network"
          } >> "$GITHUB_OUTPUT"
          echo "fresh_generation=$generation"

  shard:
    name: Build, verify and transfer real shard 0 only
    needs: [admission, receiver]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ needs.admission.outputs.head_sha }}
          persist-credentials: false
      - name: Assert hosted runner and free disk
        run: |
          set -Eeuo pipefail
          test "$(nproc)" -eq 4
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          df -h /
      - name: Plan canonical 32-way assignment
        run: |
          set -Eeuo pipefail
          python3 -m tools.otbm_atlas.world_shards plan \
            vendor/map-analysis/crystalserver/data-global/world/world.otbm \
            vendor/map-analysis/tibia-client/15.25.bd5a04/assets \
            build/one-shard-proof-plan.json --shards 32
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('build/one-shard-proof-plan.json').read_text())
          assert plan['shardCount']==32
          assert plan['chunks']==3494
          assert plan['sources']['mapSha256']=='3bd40d14fefec41f24c4b3ae879e420be1a831ef55b95dcbec721e587a09b034'
          assert plan['sources']['atlasVersion']==3
          print({'plan':'PASS','shard0Chunks':plan['assignments'][0]['chunkCount'],'worldPlanDigest':plan['worldPlanDigest']})
          PY
      - name: Build shard 0 only
        run: |
          set -Eeuo pipefail
          python3 -m tools.otbm_atlas.world_shards build \
            vendor/map-analysis/crystalserver/data-global/world/world.otbm \
            vendor/map-analysis/tibia-client/15.25.bd5a04/assets \
            build/one-shard-proof-plan.json build/one-shard-proof-0 \
            --shard 0 --workers 4
      - name: Independently verify source shard
        run: |
          set -Eeuo pipefail
          python3 -m tools.otbm_atlas.verify_world_shard build/one-shard-proof-0 \
            --output build/one-shard-proof-0/verification.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('build/one-shard-proof-0/verification.json').read_text())
          assert value['ok'] is True
          assert value['missingSprites']=={}
          print({'sourceVerification':'PASS','chunks':value['chunks']})
          PY
      - name: Transfer with job-scoped GitHub OIDC and wait for COMPLETE receipt
        env:
          ATLAS_INGEST_URL: ${{ needs.receiver.outputs.url }}
          OIDC_AUDIENCE: ots-atlas-ci-ingest:${{ github.run_id }}:${{ github.run_attempt }}
          PRODUCER_SHA: ${{ needs.admission.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          ATLAS_INGEST_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_response")"
          test -n "$ATLAS_INGEST_TOKEN"
          echo "::add-mask::$ATLAS_INGEST_TOKEN"
          unset oidc_response
          python3 deploy/otbm-atlas-ci-ingest/upload_bundle.py build/one-shard-proof-0 \
            --url "$ATLAS_INGEST_URL" \
            --token "$ATLAS_INGEST_TOKEN" \
            --bundle-id shard-00-proof \
            --producer-sha "$PRODUCER_SHA" \
            --kind shard --shard-index 0 | tee "$RUNNER_TEMP/shard-upload-result.json"
          unset ATLAS_INGEST_TOKEN
          python3 - "$RUNNER_TEMP/shard-upload-result.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1]))
          receipt=value['receipt']
          assert receipt['status']=='COMPLETE'
          assert receipt['archiveSha256']==value['archiveSha256']
          assert receipt['archiveBytes']==value['archiveBytes']
          print(json.dumps({'sourceReleaseGate':'PASS','status':receipt['status'],'archiveBytes':value['archiveBytes'],'archiveSha256':value['archiveSha256'],'parts':value['parts'],'producerSha':receipt['producerSha']},sort_keys=True))
          PY

  verify:
    name: Reverify physical shard after hosted runner exits
    if: always() && needs.receiver.result == 'success'
    needs: [admission, receiver, shard]
    runs-on: [ots, synology]
    timeout-minutes: 20
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ needs.admission.outputs.head_sha }}
          persist-credentials: false
      - name: Independently reverify host-mounted shard and deterministic archive identity
        id: reverify
        if: needs.shard.result == 'success'
        env:
          GENERATION: ${{ needs.receiver.outputs.generation }}
          PRODUCER_SHA: ${{ needs.admission.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME:-}" = "synology-ots-01"
          host_root="/volume1/docker/otheryn/atlas/ci-ingest-tests/${GENERATION}"
          docker run --rm -i \
            -e GENERATION -e PRODUCER_SHA \
            -v /volume1/docker/otheryn/atlas:/atlas:ro \
            -v "${host_root}/control/repo:/repo:ro" \
            -w /repo python:3.12-slim python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          from tools.otbm_atlas.verify_world_shard import verify_world_shard

          generation = os.environ['GENERATION']
          producer_sha = os.environ['PRODUCER_SHA']
          root = Path('/atlas/ci-ingest-tests') / generation
          bundle = root / 'bundles/shard-00-proof'
          receipt_path = root / 'receipts/shard-00-proof.json'
          assert bundle.is_dir(), bundle
          assert receipt_path.is_file(), receipt_path
          verify = verify_world_shard(bundle)
          assert verify['ok'] is True, verify['errors']
          assert verify['missingSprites'] == {}
          spec = importlib.util.spec_from_file_location('atlas_uploader', '/repo/deploy/otbm-atlas-ci-ingest/upload_bundle.py')
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          archive_path = Path('/tmp/rebuilt.tar')
          info = module.build_archive(bundle, archive_path)
          receipt = json.loads(receipt_path.read_text())
          assert receipt['status'] == 'COMPLETE'
          assert receipt['producerSha'] == producer_sha
          assert receipt['shardIndex'] == 0
          assert receipt['archiveBytes'] == info['bytes']
          assert receipt['archiveSha256'] == info['sha256']
          print(json.dumps({'postSourcePhysicalVerification':'PASS','status':receipt['status'],'archiveBytes':info['bytes'],'archiveSha256':info['sha256'],'parts':len(receipt['parts']),'producerSha':receipt['producerSha'],'chunks':verify['chunks']},sort_keys=True))
          PY
      - name: Stop transport and clean only a successfully reverified generation
        if: always()
        env:
          GENERATION: ${{ needs.receiver.outputs.generation }}
          RECEIVER: ${{ needs.receiver.outputs.receiver }}
          TUNNEL: ${{ needs.receiver.outputs.tunnel }}
          NETWORK: ${{ needs.receiver.outputs.network }}
          REVERIFY_OUTCOME: ${{ steps.reverify.outcome }}
        run: |
          set -Eeuo pipefail
          docker rm -f "$RECEIVER" "$TUNNEL" >/dev/null 2>&1 || true
          docker network rm "$NETWORK" >/dev/null 2>&1 || true
          if [[ "$REVERIFY_OUTCOME" == success ]]; then
            docker run --rm -v /volume1/docker/otheryn/atlas:/atlas alpine:3.22 \
              sh -lc "rm -rf '/atlas/ci-ingest-tests/${GENERATION}'"
            echo "reverified_generation_cleanup=complete"
          else
            echo "reverify_outcome=$REVERIFY_OUTCOME; generation preserved for operator inspection"
          fi
      - name: Require source shard success
        if: always()
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: test "$SHARD_RESULT" = success
