name: PRS-003C contract patch

on:
  push:
    branches:
      - dudantas/prs-003c-live-protocol-wiring
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: dudantas/prs-003c-live-protocol-wiring
          fetch-depth: 0

      - name: Apply exact contract replacements
        run: python3 tools/agents/patches/apply_prs003c_contract_update.py

      - name: Remove branch-only patch machinery
        run: |
          rm tools/agents/patches/apply_prs003c_contract_update.py
          rm .github/workflows/prs003c-contract-patch.yml

      - name: Commit contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/prs-003-database-outage-state-machine-contract.md \
                  tools/agents/patches/apply_prs003c_contract_update.py \
                  .github/workflows/prs003c-contract-patch.yml
          git commit -m "docs(resilience): record PRS-003C live admission"
          git push origin HEAD:dudantas/prs-003c-live-protocol-wiring
