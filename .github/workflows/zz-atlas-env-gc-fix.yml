name: Temporary Atlas Resume GC Fix
on:
  push:
    branches: [blakinio/atlas-environment-animation-resume]
    paths: [.github/workflows/zz-atlas-env-gc-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: blakinio/atlas-environment-animation-resume
      - name: Remove stale invalidated shards and orphan payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/otbm_atlas/environment_animation_resume.py')
          text=p.read_text(encoding='utf-8')
          old='''    animation_keys: set[str] = set()\n    instances = chunks_with_records = fallbacks = reused = 0\n    total = len(manifest_chunks)\n'''
          new='''    animation_keys: set[str] = set()\n    live_assets: set[str] = set()\n    instances = chunks_with_records = fallbacks = reused = 0\n    total = len(manifest_chunks)\n'''
          if old not in text: raise SystemExit('counter insertion point missing')
          text=text.replace(old,new,1)
          old='''            animation_keys.update(str(key) for key in checkpoint.get("animationKeys", []))\n            print(f"ENV_ANIM_PROGRESS completed={ordinal}/{total} reused={reused} chunk=z{z}/{chunk_x}_{chunk_y} status=reused", flush=True)\n'''
          new='''            animation_keys.update(str(key) for key in checkpoint.get("animationKeys", []))\n            live_assets.update(str(path) for path in checkpoint.get("assets", []))\n            print(f"ENV_ANIM_PROGRESS completed={ordinal}/{total} reused={reused} chunk=z{z}/{chunk_x}_{chunk_y} status=reused", flush=True)\n'''
          if old not in text: raise SystemExit('reuse insertion point missing')
          text=text.replace(old,new,1)
          old='''        shard_relative: str | None = None\n        if records:\n            shard_relative = f"data/environment-animations/chunks/z{z}/{chunk_x}_{chunk_y}.json"\n            shard_path = output / shard_relative\n            shard_path.parent.mkdir(parents=True, exist_ok=True)\n            temporary = shard_path.with_suffix(shard_path.suffix + ".tmp")\n            temporary.write_text(json.dumps({"schemaVersion": 2, "records": records}, separators=(",", ":"), sort_keys=True) + "\\n", encoding="utf-8")\n            temporary.replace(shard_path)\n'''
          new='''        shard_relative: str | None = None\n        canonical_shard_relative = f"data/environment-animations/chunks/z{z}/{chunk_x}_{chunk_y}.json"\n        canonical_shard_path = output / canonical_shard_relative\n        if records:\n            shard_relative = canonical_shard_relative\n            canonical_shard_path.parent.mkdir(parents=True, exist_ok=True)\n            temporary = canonical_shard_path.with_suffix(canonical_shard_path.suffix + ".tmp")\n            temporary.write_text(json.dumps({"schemaVersion": 2, "records": records}, separators=(",", ":"), sort_keys=True) + "\\n", encoding="utf-8")\n            temporary.replace(canonical_shard_path)\n        elif canonical_shard_path.exists():\n            canonical_shard_path.unlink()\n'''
          if old not in text: raise SystemExit('shard block missing')
          text=text.replace(old,new,1)
          old='''        animation_keys.update(chunk_keys)\n        print(f"ENV_ANIM_PROGRESS completed={ordinal}/{total} reused={reused} chunk=z{z}/{chunk_x}_{chunk_y} instances={len(records)} fallbacks={chunk_fallbacks}", flush=True)\n\n    data_files = [path for path in root.rglob("*") if path.is_file() and path.name not in {"export-state.json", "index.json"}]\n'''
          new='''        animation_keys.update(chunk_keys)\n        live_assets.update(chunk_assets)\n        print(f"ENV_ANIM_PROGRESS completed={ordinal}/{total} reused={reused} chunk=z{z}/{chunk_x}_{chunk_y} instances={len(records)} fallbacks={chunk_fallbacks}", flush=True)\n\n    # Per-chunk invalidation can make old assets unreachable. Remove only payload\n    # files that no surviving checkpoint/record references; checkpoints and shards\n    # are managed separately and are never inferred from directory contents.\n    for kind in ("frames", "underlays", "overdraws"):\n        payload_root = root / kind\n        if not payload_root.exists():\n            continue\n        for path in sorted((candidate for candidate in payload_root.rglob("*") if candidate.is_file())):\n            relative = path.relative_to(output).as_posix()\n            if relative not in live_assets:\n                path.unlink()\n        for directory in sorted((candidate for candidate in payload_root.rglob("*") if candidate.is_dir()), reverse=True):\n            try:\n                directory.rmdir()\n            except OSError:\n                pass\n\n    data_files = [path for path in root.rglob("*") if path.is_file() and path.name not in {"export-state.json", "index.json"}]\n'''
          if old not in text: raise SystemExit('gc insertion point missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8',newline='\n')

          t=Path('tools/otbm_atlas/tests/test_environment_animation_resume.py')
          tests=t.read_text(encoding='utf-8')
          marker='''    def test_clean_rebuild_is_byte_deterministic(self) -> None:\n'''
          addition='''    def test_changed_chunk_removes_stale_shard_and_orphan_payloads(self) -> None:\n        output, assets = self.make_fixture()\n        spool_path = output / ".spool/z7/1_1.bin"\n        with patch("tools.otbm_atlas.environment_animation_resume.AssetRenderer", _FakeRenderer):\n            enrich_environment_animations_resumable(assets, output)\n            environment = output / "data/environment-animations"\n            shard = environment / "chunks/z7/1_1.json"\n            old_payloads = {path for path in environment.rglob("*.png")}\n            self.assertTrue(shard.is_file())\n            self.assertTrue(old_payloads)\n            spool_path.write_bytes(encode_tile(Tile(Position(150, 150, 7), None, 0, Item(999), ())))\n            report = enrich_environment_animations_resumable(assets, output)\n        self.assertEqual(report["instances"], 0)\n        self.assertEqual(report["chunks"], 0)\n        self.assertFalse(shard.exists())\n        self.assertFalse(any(path.exists() for path in old_payloads))\n\n'''
          if marker not in tests: raise SystemExit('test marker missing')
          t.write_text(tests.replace(marker,addition+marker,1),encoding='utf-8',newline='\n')
          PY
          rm .github/workflows/zz-atlas-env-gc-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/otbm_atlas .github/workflows/zz-atlas-env-gc-fix.yml
          git commit -m 'fix(atlas): remove stale environment animation payloads'
          git push origin HEAD:blakinio/atlas-environment-animation-resume
