---
name: TEMP Atlas host disk probe fix

on:
  push:
    branches:
      - fix/atlas-synology-host-disk-probe
    paths:
      - ".github/workflows/_tmp-atlas-host-disk-probe-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Route Synology disk probe through Docker host bind
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/otbm-atlas-full-world-16.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''          available_kb="$(df -Pk /volume1/docker/otheryn/atlas | awk 'NR==2 {print $4}')"\n'''
          new = '''          available_kb="$(docker run --rm -v /volume1/docker/otheryn/atlas:/atlas alpine:3.22 df -Pk /atlas | awk 'NR==2 {print $4}')"\n'''
          assert text.count(old) == 1, 'expected exactly one direct Synology df probe'
          text = text.replace(old, new, 1)
          workflow.write_text(text, encoding='utf-8')

          request = Path('deploy/otbm-atlas-ci-ingest/deployment-request.json')
          value = json.loads(request.read_text(encoding='utf-8'))
          assert value['requestId'] == 'oth-20260817-atlas-production-1'
          value['requestId'] = 'oth-20260817-atlas-production-2'
          request.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/_tmp-atlas-host-disk-probe-fix.yml').unlink()
          PY
          git diff --check
          git diff -- .github/workflows/otbm-atlas-full-world-16.yml deploy/otbm-atlas-ci-ingest/deployment-request.json .github/workflows/_tmp-atlas-host-disk-probe-fix.yml
      - name: Commit exact production fix and self-delete helper
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/otbm-atlas-full-world-16.yml deploy/otbm-atlas-ci-ingest/deployment-request.json .github/workflows/_tmp-atlas-host-disk-probe-fix.yml
          git commit -m 'fix(atlas): probe Synology disk through Docker host'
          git push origin "HEAD:${GITHUB_REF_NAME}"
