name: OAM-051B Materialize Wheel Payload

on:
  push:
    branches:
      - dudantas/oam-051b-task-shop-adapt
    paths:
      - .github/workflows/oam-051b-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dudantas/oam-051b-task-shop-adapt
          fetch-depth: 0

      - name: Apply bounded official Wheel payload patch
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("src/creatures/players/components/wheel/player_wheel.cpp")
          source = source_path.read_text(encoding="utf-8")
          old = """\tif (usesOfficialSkillWheelPayload) {
          \t\t// Current clients read a quest flag plus a u16 bonus before the gem lists.
          \t\tmsg.addByte(hasMonkQuestBonus ? 1 : 0); // The Way of the Monk quest bonus
          \t\tmsg.add<uint16_t>(hasMonkQuestBonus ? static_cast<uint16_t>(std::min<int32_t>(monkQuestBonus, 0xFFFF)) : 0);
          \t} else {
          """
          new = """\tif (usesOfficialSkillWheelPayload) {
          \t\t// Current clients read the Monk quest flag followed by purchased Hunting Task Shop points.
          \t\tmsg.addByte(hasMonkQuestBonus ? 1 : 0); // The Way of the Monk quest bonus flag
          \t\tmsg.add<uint16_t>(static_cast<uint16_t>(std::clamp<int32_t>(m_player.getStorageValue(1000006), 0, 50)));
          \t} else {
          """
          if source.count(old) != 1:
              raise SystemExit(f"expected one exact official Wheel payload anchor, found {source.count(old)}")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/oam-051b-materialize.yml").unlink()

      - name: Commit materialized source and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/creatures/players/components/wheel/player_wheel.cpp .github/workflows/oam-051b-materialize.yml
          git commit -m "fix(oam): align Wheel Task Shop payload"
          git push origin HEAD:dudantas/oam-051b-task-shop-adapt
