name: PRS-004D Materializer

on:
  push:
    branches:
      - dudantas/prs-004d-protected-player-save
    paths:
      - .github/workflows/prs-004d-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dudantas/prs-004d-protected-player-save
          fetch-depth: 0

      - name: Materialize protected player-save integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement marker")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

