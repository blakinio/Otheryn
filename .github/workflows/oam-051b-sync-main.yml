name: OAM-051B Sync Main

on:
  push:
    branches:
      - dudantas/oam-051b-task-shop-adapt
    paths:
      - .github/workflows/oam-051b-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dudantas/oam-051b-task-shop-adapt
          fetch-depth: 0

      - name: Merge current main and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/oam-051b-sync-main.yml
          git commit --amend --no-edit
          git push origin HEAD:dudantas/oam-051b-task-shop-adapt
