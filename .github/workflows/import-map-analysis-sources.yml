---
name: Import pinned map analysis sources

on:
  push:
    branches:
      - blakinio/vendor-crystalserver-world
    paths:
      - .github/workflows/import-map-analysis-sources.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRYSTAL_COMMIT: 5e89bf8329ea406cb4ea8f4a18f32954f13e5418
      ASSETS_JSON_SHA256: 4cbdf80eee33901f2eb4f3391e23ad02805b65890ca856efcd9c32c54888405a
      ASSETS_VERSION: 15.25.bd5a04
      MIRROR_URL: https://github.com/dudantas/tibia-client/releases/download/15.25.0a00a0/tibia-client-15.25.0a00a0.zip
    steps:
      - name: Checkout task branch without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$GITHUB_REF_NAME" "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Import exact CrystalServer world tree
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/zimbadev/crystalserver.git /tmp/crystalserver
          git -C /tmp/crystalserver fetch --depth=1 origin "$CRYSTAL_COMMIT"
          git -C /tmp/crystalserver checkout --detach "$CRYSTAL_COMMIT"
          test "$(git -C /tmp/crystalserver rev-parse HEAD)" = "$CRYSTAL_COMMIT"
          rm -rf repo/vendor/map-analysis/crystalserver/data-global/world
          mkdir -p repo/vendor/map-analysis/crystalserver/data-global
          cp -a /tmp/crystalserver/data-global/world repo/vendor/map-analysis/crystalserver/data-global/world

      - name: Import exact Tibia client assets from verified mirror
        run: |
          set -euo pipefail
          rm -rf /tmp/tibia-mirror
          mkdir -p /tmp/tibia-mirror
          curl --fail --location --retry 3 --retry-all-errors "$MIRROR_URL" -o /tmp/tibia-client.zip
          unzip -q /tmp/tibia-client.zip -d /tmp/tibia-mirror
          mapfile -t manifests < <(find /tmp/tibia-mirror -type f -name assets.json -print)
          test "${#manifests[@]}" -ge 1
          exact=""
          for candidate in "${manifests[@]}"; do
            actual="$(sha256sum "$candidate" | awk '{print $1}')"
            echo "candidate assets.json: $candidate $actual"
            if [ "$actual" = "$ASSETS_JSON_SHA256" ]; then
              exact="$candidate"
              break
            fi
          done
          test -n "$exact"
          source_root="$(dirname "$exact")"
          test -d "$source_root/assets"
          rm -rf "repo/vendor/map-analysis/tibia-client/$ASSETS_VERSION"
          mkdir -p "repo/vendor/map-analysis/tibia-client/$ASSETS_VERSION"
          cp "$exact" "repo/vendor/map-analysis/tibia-client/$ASSETS_VERSION/assets.json"
          cp -a "$source_root/assets" "repo/vendor/map-analysis/tibia-client/$ASSETS_VERSION/assets"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path('repo/vendor/map-analysis/tibia-client') / os.environ['ASSETS_VERSION']
          manifest_path = root / 'assets.json'
          manifest = json.loads(manifest_path.read_text())
          rows = [x for x in manifest['files'] if x.get('localfile', '').startswith('assets/')]

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          checked = 0
          for entry in rows:
              path = root / entry['localfile']
              if not path.is_file():
                  raise RuntimeError(f"missing asset: {entry['localfile']}")
              unpacked_hash = entry.get('unpackedhash')
              if unpacked_hash:
                  if sha(path) != unpacked_hash:
                      raise RuntimeError(f"asset hash mismatch: {entry['localfile']}")
              else:
                  packed_hash = entry.get('packedhash')
                  if packed_hash and sha(path) != packed_hash:
                      raise RuntimeError(f"asset hash mismatch: {entry['localfile']}")
              expected_size = entry.get('unpackedsize') if entry.get('unpack', True) else entry.get('packedsize')
              if expected_size is not None and path.stat().st_size != expected_size:
                  raise RuntimeError(f"asset size mismatch: {entry['localfile']}")
              checked += 1
          actual = sum(1 for p in (root / 'assets').rglob('*') if p.is_file())
          if actual != checked:
              raise RuntimeError(f'asset count mismatch: manifest {checked}, directory {actual}')
          print(f'verified {checked} exact asset files')
          PY

      - name: Record provenance and commit imported data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          mkdir -p vendor/map-analysis
          cat > vendor/map-analysis/README.md <<EOF
          # Map analysis source data

          This directory is intentionally vendored for deterministic OTBM analysis and rendering.

          - CrystalServer world source: zimbadev/crystalserver@$CRYSTAL_COMMIT
          - Primary map: crystalserver/data-global/world/world.otbm
          - Tibia asset package: $ASSETS_VERSION
          - Exact assets manifest SHA-256: $ASSETS_JSON_SHA256
          - Asset transport mirror is accepted only after exact manifest and per-file hash verification.

          Do not silently replace either source with a newer revision. Update provenance and hashes explicitly.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/map-analysis
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m "chore(maps): vendor pinned map analysis sources"
          git push origin "HEAD:$GITHUB_REF_NAME"
