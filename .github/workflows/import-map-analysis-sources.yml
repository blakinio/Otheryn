---
name: Import pinned map analysis sources

on:
  push:
    branches:
      - blakinio/vendor-crystalserver-world
    paths:
      - .github/workflows/import-map-analysis-sources.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRYSTAL_COMMIT: 5e89bf8329ea406cb4ea8f4a18f32954f13e5418
      ASSETS_VERSION: 15.25.bd5a04
      ASSETS_SUBSET_SHA256: a62fe81b207304c0d109fc046ceba17b9320f3363aabb20fe2dbee3c63a1b045
      ASSETS_COUNT: '6031'
      ASSETS_TOTAL_SIZE: '124591048'
      CATALOG_SHA256: 93ea5888174ef44b352d7c2b1f8061573a4a260bfaba4b7ec32ea836b9e411ab
      CATALOG_LF_SHA256: c57d70ba4f7e2cfb3bbb85c96572cf56854d71001f920f1e50c91b4e91748829
      MIRROR_URL: https://github.com/dudantas/tibia-client/releases/download/15.25.0a00a0/tibia-client-15.25.0a00a0.zip
    steps:
      - name: Checkout task branch without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$GITHUB_REF_NAME" "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Import exact CrystalServer world tree
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/zimbadev/crystalserver.git /tmp/crystalserver
          git -C /tmp/crystalserver fetch --depth=1 origin "$CRYSTAL_COMMIT"
          git -C /tmp/crystalserver checkout --detach "$CRYSTAL_COMMIT"
          test "$(git -C /tmp/crystalserver rev-parse HEAD)" = "$CRYSTAL_COMMIT"
          rm -rf repo/vendor/map-analysis/crystalserver/data-global/world
          mkdir -p repo/vendor/map-analysis/crystalserver/data-global
          cp -a /tmp/crystalserver/data-global/world repo/vendor/map-analysis/crystalserver/data-global/world

      - name: Import exact Tibia asset subset from verified mirror
        run: |
          set -euo pipefail
          rm -rf /tmp/tibia-mirror
          mkdir -p /tmp/tibia-mirror
          curl --fail --location --retry 3 --retry-all-errors "$MIRROR_URL" -o /tmp/tibia-client.zip
          unzip -q /tmp/tibia-client.zip -d /tmp/tibia-mirror
          manifest="$(find /tmp/tibia-mirror -type f -name assets.json -print -quit)"
          test -n "$manifest"
          source_root="$(dirname "$manifest")"
          test -d "$source_root/assets"
          MANIFEST="$manifest" python3 - <<'PY'
          import hashlib, json, os, pathlib
          p = pathlib.Path(os.environ['MANIFEST'])
          m = json.loads(p.read_text())
          rows = [x for x in m['files'] if x.get('localfile','').startswith('assets/')]
          blob = json.dumps(rows, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          digest = hashlib.sha256(blob).hexdigest()
          print('asset subset count:', len(rows))
          print('asset subset sha256:', digest)
          if len(rows) != int(os.environ['ASSETS_COUNT']): raise SystemExit('asset subset count mismatch')
          if digest != os.environ['ASSETS_SUBSET_SHA256']: raise SystemExit('asset subset manifest mismatch')
          PY
          catalog="$source_root/assets/catalog-content.json"
          catalog_actual="$(sha256sum "$catalog" | awk '{print $1}')"
          echo "catalog transport sha256: $catalog_actual"
          if [ "$catalog_actual" = "$CATALOG_LF_SHA256" ]; then
            CATALOG="$catalog" python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ['CATALOG'])
          data = p.read_bytes()
          if b'\r\n' in data: raise SystemExit('expected LF-only transport catalog')
          p.write_bytes(data.replace(b'\n', b'\r\n'))
          PY
          elif [ "$catalog_actual" != "$CATALOG_SHA256" ]; then
            echo "unexpected catalog representation" >&2
            exit 1
          fi
          echo "$CATALOG_SHA256  $catalog" | sha256sum --check --strict
          rm -rf "repo/vendor/map-analysis/tibia-client/$ASSETS_VERSION"
          mkdir -p "repo/vendor/map-analysis/tibia-client/$ASSETS_VERSION"
          cp "$manifest" "repo/vendor/map-analysis/tibia-client/$ASSETS_VERSION/assets.json"
          cp -a "$source_root/assets" "repo/vendor/map-analysis/tibia-client/$ASSETS_VERSION/assets"
          ROOT="repo/vendor/map-analysis/tibia-client/$ASSETS_VERSION" python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['ROOT'])
          manifest = json.loads((root / 'assets.json').read_text())
          rows = [x for x in manifest['files'] if x.get('localfile','').startswith('assets/')]
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              return h.hexdigest()
          mismatches=[]
          for entry in rows:
              p = root / entry['localfile']
              if not p.is_file():
                  mismatches.append((entry['localfile'],'missing'))
                  continue
              expected = entry.get('unpackedhash') if entry.get('unpack', True) else entry.get('packedhash')
              actual=sha(p)
              size = entry.get('unpackedsize') if entry.get('unpack', True) else entry.get('packedsize')
              if expected and actual != expected: mismatches.append((entry['localfile'],f'hash {actual} != {expected}'))
              if size is not None and p.stat().st_size != size: mismatches.append((entry['localfile'],f'size {p.stat().st_size} != {size}'))
          actual_count=sum(1 for p in (root/'assets').rglob('*') if p.is_file())
          actual_size=sum(p.stat().st_size for p in (root/'assets').rglob('*') if p.is_file())
          print('asset files:', actual_count, 'bytes:', actual_size, 'mismatches:', len(mismatches))
          if actual_count != int(os.environ['ASSETS_COUNT']): raise RuntimeError('asset count mismatch')
          if actual_size != int(os.environ['ASSETS_TOTAL_SIZE']): raise RuntimeError('asset total size mismatch')
          if mismatches:
              for row in mismatches[:100]: print('MISMATCH', row)
              raise RuntimeError(f'{len(mismatches)} asset mismatches')
          print(f'verified {len(rows)} exact assets byte-for-byte')
          PY

      - name: Record provenance and commit imported data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          mkdir -p vendor/map-analysis
          cat > vendor/map-analysis/README.md <<EOF
          # Map analysis source data

          Vendored deterministic sources for OTBM analysis and rendering.

          - CrystalServer: zimbadev/crystalserver@$CRYSTAL_COMMIT
          - Primary map: crystalserver/data-global/world/world.otbm
          - Tibia assets label: $ASSETS_VERSION
          - Exact 6031-entry asset-subset manifest SHA-256: $ASSETS_SUBSET_SHA256
          - Exact catalog-content SHA-256: $CATALOG_SHA256

          The GitHub mirror is transport only. The asset-only manifest, every file hash and size, file count and total size are verified against the owner-provided package; the mirror's LF-normalized catalog is restored to the package's exact CRLF bytes before verification.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/map-analysis
          test -n "$(git status --porcelain)"
          git commit -m "chore(maps): vendor pinned map analysis sources"
          git push origin "HEAD:$GITHUB_REF_NAME"
